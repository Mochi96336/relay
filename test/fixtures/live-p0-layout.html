<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Relay Live P0 layout fixture</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/live-state.css">
  <link rel="stylesheet" href="/adjust.css">
  <link rel="stylesheet" href="/song-surface.css">
  <link rel="stylesheet" href="/live-ia.css">
  <style>
    /* Fixture-only deterministic media. Product Take / Room sound DOM and
       presentation are owned by their production modules below. */
    .fixture-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      display: grid;
      place-items: center;
      border: 1px solid #292b30;
      border-radius: 12px;
      background: #0b0c0e;
      color: #70737a;
      font-size: 12px;
    }
    .fixture-player button { min-width: 44px; min-height: 44px; }
    .fixture-hidden { display: none !important; }
  </style>
</head>
<body data-health="healthy" data-room-mic="live" data-self-mic="off" data-listen="audible">
  <main class="live-shell">
    <header class="room-header">
      <strong>Relay</strong>
      <div class="room-header-actions"><button type="button">2 人</button><button type="button" aria-label="更多">•••</button></div>
    </header>

    <section class="song-stage">
      <div class="song-heading-row"><span>歌曲</span><button id="change-youtube" class="text-action" type="button">換歌</button></div>
      <div class="song-observer"><strong>林俊傑－偉大的渺小</strong><span>偉大的渺小</span></div>
      <div class="youtube-player-shell fixture-player" id="fixture-player"><button type="button" aria-label="播放">▶</button></div>
    </section>

    <section class="performance-stage">
      <span class="section-label">Mic</span>
      <div class="voice-copy"><strong id="fixture-voice-title">浚翔正在唱</strong><span>Room Mic</span></div>
      <div class="voice-input-evidence"><div class="voice-input-meter" aria-hidden="true">▁▂▅▇▆▃▂</div></div>
      <div class="mic-actions"><button id="start-publisher" type="button">拿 Mic</button></div>

      <section class="take-strip" aria-label="Take recording" data-take-state="ready">
        <div class="take-actions"><button id="start-recording" type="button">● 開始錄音</button></div>
        <p id="recording-status" class="microcopy"></p>
        <div id="last-take" class="last-take" hidden>
          <button id="last-take-toggle" class="take-link text-action" type="button" aria-expanded="false">上一段錄音</button>
          <div id="last-take-review" class="take-review" hidden>
            <audio id="recording-player" controls preload="metadata"></audio>
            <a id="download-recording" class="take-download text-action" download>下載 WAV</a>
          </div>
        </div>
      </section>

      <details class="mic-live-control" id="mic-live-control"><summary><span>Mic</span><output>+24 dB</output></summary></details>
    </section>

    <footer class="live-actions">
      <section class="local-listen local-sound-control" aria-labelledby="local-listen-label">
        <div class="adjust-group-heading">
          <span id="local-listen-label" class="section-label">Room sound</span>
          <span>This device only</span>
          <button id="listen-toggle" class="text-action" type="button" aria-pressed="false">Mute</button>
        </div>
        <label class="adjust-control" for="listen-gain">
          <div class="adjust-row-heading"><strong>Volume</strong><output id="listen-gain-value" for="listen-gain">30%</output></div>
          <input id="listen-gain" class="adjust-range" type="range" min="0" max="100" step="1" value="30">
        </label>
        <p id="listen-adjust-state" class="adjust-helper">Sound is on by default after your first interaction.</p>
        <span id="listen-note" class="action-note" aria-live="polite"></span>
      </section>
    </footer>
  </main>

  <script type="module">
    const visualStates = [
      'empty',
      'listener',
      'singer',
      'recording',
      'take-history-one',
      'take-history-many',
      'room-sound-normal',
      'room-sound-muted',
      'room-sound-forced',
    ];
    const params = new URLSearchParams(location.search);
    const requestedState = params.get('state') || 'listener';
    const state = visualStates.includes(requestedState) ? requestedState : 'listener';
    document.body.dataset.fixtureState = state;

    window.relayI18n = { getLocale: () => 'zh-Hant' };
    window.relayIdentityReady = Promise.resolve();
    window.relayParticipantId = 'fixture-phone';

    const roomDetails = {
      normal: { state: 'audible', phase: 'playing', muted: false, forcedReason: null, volumePercent: 30 },
      muted: { state: 'muted', phase: 'user-muted', muted: true, forcedReason: null, volumePercent: 30 },
      forced: { state: 'mic-muted', phase: 'mic-owned', muted: true, forcedReason: 'mic', volumePercent: 30 },
    };

    const roomKind = state === 'room-sound-muted'
      ? 'muted'
      : state === 'room-sound-forced' || state === 'singer' || state === 'recording'
        ? 'forced'
        : 'normal';
    window.relayListenState = roomDetails[roomKind];

    const voiceTitle = document.querySelector('#fixture-voice-title');
    const micAction = document.querySelector('#start-publisher');
    const recordStrip = document.querySelector('.take-strip');
    const recordButton = document.querySelector('#start-recording');
    const songStage = document.querySelector('.song-stage');
    const performance = document.querySelector('.performance-stage');

    function singer(recording = false) {
      document.body.dataset.selfMic = 'live';
      document.body.dataset.roomMic = 'live';
      voiceTitle.textContent = '你正在唱';
      micAction.textContent = '放開 Mic';
      document.querySelector('#mic-live-control').style.display = 'block';
      if (recording) {
        recordStrip.dataset.takeState = 'recording';
        recordButton.textContent = '● 錄音中 0:18';
      }
    }

    function historyEntries(many) {
      const base = {
        songVideoId: null,
        qualityVerdict: 'clean',
        recovered: false,
      };
      const entries = [
        { ...base, takeId: 'take-2103', endedAtMs: 1787158980000, artifact: { url: '/fixture-take-2103.wav', durationMs: 155000 } },
      ];
      if (many) {
        entries.push(
          { ...base, takeId: 'take-2056', endedAtMs: 1787158560000, artifact: { url: '/fixture-take-2056.wav', durationMs: 151000 } },
          { ...base, takeId: 'take-2042', endedAtMs: 1787157720000, artifact: { url: '/fixture-take-2042.wav', durationMs: 149000 } },
        );
      }
      return entries;
    }

    if (state === 'empty') {
      document.body.dataset.roomMic = 'off';
      songStage.querySelector('.song-observer').innerHTML = '<strong>尚未選歌</strong><span>等待房間選擇歌曲</span>';
      document.querySelector('#fixture-player').classList.add('fixture-hidden');
      performance.classList.add('fixture-hidden');
    } else if (state === 'singer') {
      singer(false);
    } else if (state === 'recording') {
      singer(true);
    }

    await import('/room-sound-ui.js');
    await import('/take-history.js');

    if (state === 'take-history-one' || state === 'take-history-many') {
      window.dispatchEvent(new CustomEvent('relay-take-status', {
        detail: {
          lifecycle: 'idle',
          history: historyEntries(state === 'take-history-many'),
        },
      }));
      const panel = document.querySelector('#take-history-panel');
      if (panel) panel.open = true;
    }

    if (state.startsWith('room-sound-')) {
      document.querySelector('.live-actions')?.scrollIntoView({ block: 'end' });
    }

    const closeEnough = (actual, expected, tolerance = 1) => Math.abs(actual - expected) <= tolerance;
    const box = (node) => node?.getBoundingClientRect?.() ?? null;

    async function reportGeometry() {
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const checks = [];
      const viewportWidth = window.innerWidth;
      const scrollWidth = document.documentElement.scrollWidth;
      checks.push(['scrollWidth', scrollWidth === viewportWidth, scrollWidth]);

      const youtube = box(document.querySelector('.youtube-player-shell'));
      if (youtube && !document.querySelector('#fixture-player')?.classList.contains('fixture-hidden')) {
        checks.push(['youtube-left', youtube.left >= 0, youtube.left]);
        checks.push(['youtube-right', youtube.right <= viewportWidth + 0.5, youtube.right]);
      }

      if (state.startsWith('take-history-')) {
        const sheet = box(document.querySelector('.take-history-sheet'));
        const audio = box(document.querySelector('#recording-player'));
        if (viewportWidth < 760) {
          checks.push(['take-x', closeEnough(sheet?.left ?? -999, 0), sheet?.left]);
          checks.push(['take-width', closeEnough(sheet?.width ?? -999, viewportWidth), sheet?.width]);
          checks.push(['take-right', closeEnough(sheet?.right ?? -999, viewportWidth), sheet?.right]);
          checks.push(['audio-width', closeEnough(audio?.width ?? -999, viewportWidth - 40), audio?.width]);
        } else {
          checks.push(['take-desktop-width', (sheet?.width ?? 9999) <= 720.5, sheet?.width]);
          checks.push(['take-desktop-center', closeEnough(sheet?.left ?? -999, (viewportWidth - (sheet?.width ?? 0)) / 2), sheet?.left]);
          checks.push(['take-desktop-not-bottom', (sheet?.bottom ?? viewportWidth) < window.innerHeight - 1, sheet?.bottom]);
        }
      }

      if (state.startsWith('room-sound-')) {
        const row = box(document.querySelector('.local-sound-control'));
        const toggle = box(document.querySelector('#listen-toggle'));
        const gain = box(document.querySelector('#listen-gain'));
        checks.push(['room-height', closeEnough(row?.height ?? -999, 44), row?.height]);
        checks.push(['toggle-width', closeEnough(toggle?.width ?? -999, 44), toggle?.width]);
        checks.push(['toggle-height', closeEnough(toggle?.height ?? -999, 44), toggle?.height]);
        checks.push(['gain-height', closeEnough(gain?.height ?? -999, 44), gain?.height]);
        if (state === 'room-sound-forced') {
          checks.push(['forced-gain-disabled', document.querySelector('#listen-gain')?.disabled === true, document.querySelector('#listen-gain')?.disabled]);
        }
      }

      const failed = checks.filter(([, ok]) => !ok);
      const result = failed.length === 0 ? 'pass' : 'fail';
      document.documentElement.dataset.geometry = result;
      const detail = failed.length
        ? failed.map(([name, , value]) => `${name}:${String(value)}`).join(',')
        : 'ok';
      const url = `/__geometry-${result}?state=${encodeURIComponent(state)}&vw=${viewportWidth}&detail=${encodeURIComponent(detail)}`;
      fetch(url).catch(() => {});
    }

    reportGeometry();
  </script>
</body>
</html>
