name: Apply Robot follower seek anchor gate

on:
  push:
    branches:
      - agent/robot-follower-seek-anchor-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-follower-seek-anchor-gate
      - name: Patch source/server and remove one-shot tooling
        shell: bash
        run: |
          python scripts/patch-robot-follower-seek-anchor-gate.py
          rm scripts/patch-robot-follower-seek-anchor-gate.py
          rm .github/workflows/patch-robot-follower-seek-anchor-gate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(timing): gate Robot follower seek on content authority"
          git push origin HEAD:agent/robot-follower-seek-anchor-gate
