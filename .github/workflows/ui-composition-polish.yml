name: Live composition polish

on:
  push:
    branches:
      - agent/live-ui-shell
    paths:
      - .github/workflows/ui-composition-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Apply formal Live composition polish
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          style_path = Path('public/style.css')
          style = style_path.read_text()

          style = replace_once(style, '''.live-shell {
  width: min(100%, 520px);
  min-height: 100svh;
  margin: 0 auto;
  padding: 24px 22px max(24px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}''', '''.live-shell {
  width: min(100%, 520px);
  min-height: 100svh;
  margin: 0 auto;
  padding: 18px 22px max(22px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}''', 'live shell rhythm')

          style = replace_once(style, '''.room-header {
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 20;
}
.room-mark {
  font-size: 17px;
  font-weight: 720;
  letter-spacing: -.025em;
}''', '''.room-header {
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 20;
}
.room-mark {
  font-size: 15px;
  font-weight: 720;
  letter-spacing: -.04em;
}''', 'room header')

          style = replace_once(style, '''.song-stage {
  padding-top: clamp(34px, 7vh, 68px);
}''', '''.song-stage {
  padding-top: clamp(22px, 4vh, 38px);
}''', 'song stage spacing')

          style = replace_once(style, '''.youtube-player-shell {
  width: 100%;
  min-height: 200px;
  overflow: hidden;
  border: 1px solid #202227;
  border-radius: 14px;
  background: #07080a;
}
.youtube-player-shell > div,
.youtube-player-shell iframe {
  display: block;
  width: 100%;
  min-height: 200px;
  aspect-ratio: 16 / 9;
  border: 0;
}''', '''.youtube-player-shell {
  width: calc(100% + 12px);
  margin-left: -6px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 18px;
  background: #07080a;
}
.youtube-player-shell > div,
.youtube-player-shell iframe {
  display: block;
  width: 100%;
  min-height: 0;
  aspect-ratio: 16 / 9;
  border: 0;
}''', 'player field')

          style = replace_once(style, '''.youtube-readout {
  margin-top: 10px;''', '''.youtube-readout {
  margin: 8px 2px 0;''', 'player readout rhythm')

          style = replace_once(style, '''.performance-stage {
  padding-top: clamp(42px, 8vh, 76px);
}''', '''.performance-stage {
  padding-top: clamp(32px, 5.5vh, 54px);
}''', 'performance spacing')

          style = replace_once(style, '''.voice-ribbon {
  height: 70px;
  margin: 4px -2px 10px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: center;
  gap: 5px;
  overflow: hidden;
}''', '''.voice-ribbon {
  height: 52px;
  margin: 7px 0 14px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: center;
  gap: 6px;
  overflow: hidden;
}''', 'voice ribbon')

          style = replace_once(style, '''.voice-copy strong {
  font-size: clamp(24px, 6vw, 34px);
  line-height: 1.04;
  letter-spacing: -.035em;
  font-weight: 690;
}''', '''.voice-copy strong {
  max-width: 12ch;
  font-size: clamp(30px, 8vw, 42px);
  line-height: .98;
  letter-spacing: -.045em;
  font-weight: 640;
}''', 'voice typography')

          style = replace_once(style, '.mic-actions { margin-top: 24px; min-height: 42px; }', '.mic-actions { margin-top: 20px; min-height: 38px; }', 'mic action spacing')

          style = replace_once(style, '''.take-strip {
  margin-top: auto;
  padding-top: clamp(42px, 8vh, 76px);
  text-align: center;
}
.take-actions { min-height: 42px; display: flex; justify-content: center; align-items: center; }''', '''.take-strip {
  margin-top: 16px;
  padding-top: 0;
  text-align: left;
}
.take-actions {
  min-height: 34px;
  display: flex;
  justify-content: flex-start;
  align-items: center;
}''', 'contextual Take placement')

          style = replace_once(style, '''#stop-recording:not(:disabled) { color: #ffaaa3; }
.take-strip .microcopy { min-height: 17px; text-align: center; }''', '''#start-recording:not(:disabled)::before,
#stop-recording:not(:disabled)::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 8px;
  border-radius: 999px;
  background: currentColor;
  vertical-align: 1px;
  opacity: .72;
}
#stop-recording:not(:disabled) { color: #ffaaa3; }
.take-strip .microcopy { min-height: 15px; text-align: left; }''', 'Take mark')

          style = replace_once(style, '''.live-actions {
  margin-top: 22px;
  padding-top: 12px;
  border-top: 1px solid #202227;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}''', '''.live-actions {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid #202227;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}''', 'control horizon')

          style = replace_once(style, '''.system-panel { margin-top: 10px; border-top: 1px solid #181a1e; }
.system-panel > summary {
  padding: 13px 0 2px;
  color: #585b62;
  font-size: 11px;
}''', '''.system-panel { margin-top: 4px; border-top: 1px solid #181a1e; }
.system-panel > summary {
  padding: 12px 0 2px;
  color: #50535a;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: .08em;
  text-transform: uppercase;
}''', 'system recession')

          marker = '''@media (prefers-reduced-motion: reduce) {
  .voice-ribbon span { animation: none !important; }
}'''
          compact = '''@media (max-height: 760px) {
  .live-shell { padding-top: 14px; }
  .song-stage { padding-top: 16px; }
  .performance-stage { padding-top: 26px; }
  .voice-ribbon { height: 42px; margin-bottom: 10px; }
  .mic-actions { margin-top: 15px; }
  .take-strip { margin-top: 10px; }
  .live-actions { padding-top: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  .voice-ribbon span { animation: none !important; }
}'''
          style = replace_once(style, marker, compact, 'short viewport rhythm')

          style = replace_once(style, '''@media (max-width: 420px) {
  .live-shell { padding-left: 17px; padding-right: 17px; }
  .song-stage { padding-top: 28px; }
  .performance-stage { padding-top: 38px; }''', '''@media (max-width: 420px) {
  .live-shell { padding-left: 17px; padding-right: 17px; }
  .song-stage { padding-top: 20px; }
  .performance-stage { padding-top: 30px; }''', 'narrow phone rhythm')

          style_path.write_text(style)

          song_path = Path('public/song-surface.css')
          song = song_path.read_text()
          song = replace_once(song, '''  border: 1px solid #202227;
  border-radius: 14px;
  background: #07080a;''', '''  border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 18px;
  background: #07080a;''', 'observer field')
          song = replace_once(song, '''.song-observer-meta strong {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -.02em;
}''', '''.song-observer-meta strong {
  max-width: 16ch;
  font-size: 20px;
  line-height: 1.02;
  font-weight: 620;
  letter-spacing: -.035em;
}''', 'observer typography')
          song += '''\n/* Empty and connecting rooms stay spatially quiet; media appears only when it exists. */
.song-stage[data-playback-role="empty"] .youtube-player-shell,
.song-stage[data-playback-role="empty"] .youtube-readout,
.song-stage[data-playback-role="empty"] #youtube-note,
.song-stage[data-playback-role="connecting"] .youtube-form,
.song-stage[data-playback-role="connecting"] .youtube-player-shell,
.song-stage[data-playback-role="connecting"] .youtube-readout,
.song-stage[data-playback-role="connecting"] #youtube-note {
  display: none;
}
'''
          song_path.write_text(song)

          state_path = Path('public/live-state.css')
          state = state_path.read_text()
          state = replace_once(state, '  opacity: .36 !important;', '  opacity: .24 !important;', 'quiet idle Voice')
          state = replace_once(state, '''body[data-self-mic="live"] .voice-ribbon span {
  opacity: .82 !important;
  animation: voice-breathe 1.1s ease-in-out infinite alternate !important;
}''', '''body[data-self-mic="live"] .voice-ribbon span {
  opacity: .86 !important;
  animation: voice-breathe 1.1s ease-in-out infinite alternate !important;
}
body[data-self-mic="live"] .voice-ribbon {
  height: 68px;
  margin-bottom: 18px;
}
body[data-self-mic="live"] .voice-copy strong {
  font-size: clamp(38px, 10.5vw, 52px);
  font-weight: 610;
}''', 'live performance emphasis')
          state_path.write_text(state)

          test_path = Path('test/live-visual-contract.test.ts')
          test_path.write_text('''import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport test from 'node:test';\n\nconst style = readFileSync(new URL('../public/style.css', import.meta.url), 'utf8');\nconst song = readFileSync(new URL('../public/song-surface.css', import.meta.url), 'utf8');\nconst state = readFileSync(new URL('../public/live-state.css', import.meta.url), 'utf8');\n\ntest('Live composition keeps Take contextual and reserves the control horizon for Listen and Adjust', () => {\n  assert.match(style, /\\.take-strip \\{[\\s\\S]*?margin-top: 16px;[\\s\\S]*?text-align: left;/);\n  assert.match(style, /\\.live-actions \\{[\\s\\S]*?margin-top: auto;[\\s\\S]*?border-top: 1px solid/);\n});\n\ntest('empty and connecting rooms do not manufacture a black media field before a song exists', () => {\n  assert.match(song, /data-playback-role="empty"[\\s\\S]*?\\.youtube-player-shell/);\n  assert.match(song, /data-playback-role="connecting"[\\s\\S]*?\\.youtube-player-shell/);\n});\n\ntest('the performance field gains visual weight only for the local live Mic owner', () => {\n  assert.match(state, /body\\[data-self-mic="live"\\] \\.voice-copy strong/);\n  assert.match(state, /font-size: clamp\\(38px, 10\\.5vw, 52px\\)/);\n  assert.match(state, /body\\[data-self-mic="off"\\] \\.voice-ribbon span[\\s\\S]*?opacity: \\.24 !important/);\n});\n\ntest('short phone viewports compress rhythm instead of dropping primary controls below arbitrary whitespace', () => {\n  assert.match(style, /@media \\(max-height: 760px\\)/);\n  assert.match(style, /\\.performance-stage \\{ padding-top: 26px; \\}/);\n  assert.match(style, /\\.take-strip \\{ margin-top: 10px; \\}/);\n});\n''')
          PY
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - run: npm test
      - name: Commit verified composition
        shell: bash
        run: |
          rm -f .github/workflows/ui-composition-polish.yml
          git config user.name 'Mochi96336'
          git config user.email '144137376+Mochi96336@users.noreply.github.com'
          git add public/style.css public/song-surface.css public/live-state.css test/live-visual-contract.test.ts .github/workflows/ui-composition-polish.yml
          git commit -m 'polish Live phone composition'
          git push origin HEAD:agent/live-ui-shell
