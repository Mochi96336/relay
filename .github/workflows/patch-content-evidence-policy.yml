name: Apply content evidence policy wiring

on:
  push:
    branches:
      - agent/robot-content-evidence-readiness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-content-evidence-readiness
      - name: Patch policy wiring and remove one-shot tooling
        run: |
          python scripts/patch-content-evidence-policy.py
          rm scripts/patch-content-evidence-policy.py
          rm .github/workflows/patch-content-evidence-policy.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(timing): expose Robot content evidence readiness to calibration policy"
          git push origin HEAD:agent/robot-content-evidence-readiness
