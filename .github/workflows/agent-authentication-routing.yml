name: Agent authentication routing construction

on:
  push:
    branches:
      - agent/server-authentication-routing

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Move only authentication routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text()

          import_anchor = "import { createRelayInfrastructureEventProtocol } from './relay-infrastructure-event-protocol.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('authentication import anchor changed')
          text = text.replace(
              import_anchor,
              import_anchor + "import { createRelayAuthenticationProtocol } from './relay-authentication-protocol.js';\n",
              1,
          )

          infra_header = "    if (payload.type === 'infrastructure-authenticate') {\n"
          participant_header = "    if (payload.type === 'participant-authenticate') {\n"
          register_header = "    if (payload.type === 'register' && payload.role === 'publisher') {"

          infra_start = text.index(infra_header)
          participant_start = text.index(participant_header, infra_start)
          register_start = text.index(register_header, participant_start)

          infra_block = text[infra_start:participant_start].rstrip()
          infra_inner = infra_block[len(infra_header):]
          if not infra_inner.endswith('    }'):
              raise SystemExit('infrastructure auth block ending changed')
          infra_inner = infra_inner[:-5]
          infra_dedented = ''.join(
              line[2:] if line.startswith('  ') else line
              for line in infra_inner.splitlines(keepends=True)
          )

          participant_block = text[participant_start:register_start].rstrip()
          participant_inner = participant_block[len(participant_header):]
          if not participant_inner.endswith('    }'):
              raise SystemExit('participant auth block ending changed')
          participant_inner = participant_inner[:-5]
          participant_dedented = ''.join(
              line[2:] if line.startswith('  ') else line
              for line in participant_inner.splitlines(keepends=True)
          )

          text = text[:infra_start] + text[register_start:]

          auth_protocol = (
              "const authenticationProtocol = createRelayAuthenticationProtocol<RelaySocket>({\n"
              "  infrastructureAuthenticate: (socket, payload) => {\n"
              + infra_dedented
              + "  },\n"
              "  participantAuthenticate: (socket, payload) => {\n"
              + participant_dedented
              + "  },\n"
              "});\n\n"
          )
          seam_anchor = 'let shuttingDown = false;'
          if text.count(seam_anchor) != 1:
              raise SystemExit('authentication seam insertion anchor changed')
          text = text.replace(seam_anchor, auth_protocol + seam_anchor, 1)

          dispatch_anchor = "    if (infrastructureEventProtocol.dispatch(socket, payload)) return;\n"
          if text.count(dispatch_anchor) != 1:
              raise SystemExit('authentication dispatch anchor changed')
          text = text.replace(
              dispatch_anchor,
              dispatch_anchor + "    if (authenticationProtocol.dispatch(socket, payload)) return;\n",
              1,
          )

          for selector in (
              "payload.type === 'infrastructure-authenticate'",
              "payload.type === 'participant-authenticate'",
          ):
              if selector in text:
                  raise SystemExit(f'inline auth selector still exists: {selector}')

          for marker in (
              'createRelayAuthenticationProtocol<RelaySocket>',
              'authenticationProtocol.dispatch(socket, payload)',
              'infrastructureAuthenticate: (socket, payload) => {',
              'infrastructureCapability.authenticate(socket, payload.key)',
              "type: 'infrastructure-authenticated'",
              'participantAuthenticate: (socket, payload) => {',
              'participantIdentityFromAuthentication(payload)',
              'infrastructureCapability.authenticated(socket)',
              'socket.participantId !== authenticated.participantId',
              "socket.close(1008, 'Participant capability mismatch.')",
              'attachParticipantIdentity(socket, authenticated)',
              "type: 'participant-authenticated'",
              "payload.type === 'register' && payload.role === 'publisher'",
              "payload.type === 'robot-source-hello'",
          ):
              if marker not in text:
                  raise SystemExit(f'missing retained authentication marker: {marker}')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Focused authentication tests
        run: >-
          node --import tsx --test --test-concurrency=1
          test/relay-authentication-protocol.test.ts
          test/server-authentication-protocol-routing.test.ts
          test/server-infrastructure-event-protocol-routing.test.ts
          test/infrastructure-authority.test.ts
          test/participant-server.test.ts
          test/mic-boundary-hardening-server.test.ts
          test/command-authority-server.test.ts
      - name: Verify diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/server.ts
      - name: Commit validated server move
        shell: bash
        run: |
          rm .github/workflows/agent-authentication-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/agent-authentication-routing.yml
          git commit -m 'refactor(server): route authentication through protocol'
          git push origin HEAD:agent/server-authentication-routing
