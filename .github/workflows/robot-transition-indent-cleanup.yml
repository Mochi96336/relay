name: Robot transition indentation cleanup

on:
  pull_request:
    branches:
      - agent/correctness-repair

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/robot-transition-bounds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-transition-bounds
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - name: Restore base indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/server.ts')
          text = path.read_text()
          old = "        && robotContentTimeline.noteFollowerCorrection(\nfromMediaTime,\ntoMediaTime,\ncontext,\nnowMs,\n);"
          new = "        && robotContentTimeline.noteFollowerCorrection(\nfromMediaTime,\ntoMediaTime,\ncontext,\nnowMs,\n        );"
          if text.count(old) != 1:
              raise SystemExit(f'expected one indentation target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run check
      - name: Commit and remove helper workflow
        run: |
          rm .github/workflows/robot-transition-indent-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts .github/workflows/robot-transition-indent-cleanup.yml
          git commit -m 'chore: finish robot transition diff cleanup'
          git push origin HEAD:agent/robot-transition-bounds
