name: one-shot participant capability fix

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/one-shot-participant-capability.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply participant capability boundary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1))

          Path('src/participant-capability.ts').write_text(r'''import { timingSafeEqual } from 'node:crypto';

const CAPABILITY_PATTERN = /^[0-9a-f]{64}$/;

export function normalizeParticipantCapability(value: unknown) {
  if (typeof value !== 'string') return null;
  const capability = value.trim();
  return CAPABILITY_PATTERN.test(capability) ? capability : null;
}

/**
 * Process-local proof that multiple sockets claiming one public participant ID
 * actually came from the same browser identity.
 *
 * Participant IDs remain safe to broadcast for presence/UI. The capability is
 * never included in room snapshots; the first authenticated socket pins it for
 * this Relay process and later sockets must present exactly the same value.
 */
export class ParticipantCapabilityRegistry {
  private readonly capabilities = new Map<string, string>();

  claim(participantId: string, value: unknown) {
    const capability = normalizeParticipantCapability(value);
    if (!capability) return false;

    const current = this.capabilities.get(participantId);
    if (current === undefined) {
      this.capabilities.set(participantId, capability);
      return true;
    }

    return timingSafeEqual(Buffer.from(current), Buffer.from(capability));
  }
}
''')

          Path('test/participant-capability.test.ts').write_text(r'''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
import { describe, test } from 'node:test';

import {
  ParticipantCapabilityRegistry,
  normalizeParticipantCapability,
} from '../src/participant-capability.js';

describe('participant capability', () => {
  test('accepts only a 256-bit lowercase hex capability', () => {
    const capability = 'ab'.repeat(32);
    assert.equal(normalizeParticipantCapability(capability), capability);
    assert.equal(normalizeParticipantCapability('AB'.repeat(32)), null);
    assert.equal(normalizeParticipantCapability('ab'.repeat(31)), null);
    assert.equal(normalizeParticipantCapability('not-a-secret'), null);
  });

  test('pins the first capability for a participant and rejects impersonation', () => {
    const registry = new ParticipantCapabilityRegistry();
    const alice = '01'.repeat(32);
    const attacker = '02'.repeat(32);

    assert.equal(registry.claim('participant-alice', alice), true);
    assert.equal(registry.claim('participant-alice', alice), true);
    assert.equal(registry.claim('participant-alice', attacker), false);
    assert.equal(registry.claim('participant-bob', attacker), true);
  });

  test('authoritative browser sockets carry the private capability with the public identity', () => {
    for (const path of [
      'public/presence.js',
      'public/app.js',
      'public/listen.js',
      'public/live-status.js',
      'public/system-details.js',
      'public/recorder.js',
      'public/youtube-sync.js',
    ]) {
      const source = readFileSync(path, 'utf8');
      assert.match(source, /relayParticipantCapability/);
      assert.match(source, /params\.set\('cap',/);
    }

    const server = readFileSync('src/server.ts', 'utf8');
    assert.match(server, /participantCapabilities\.claim\(/);
    assert.match(server, /normalizeParticipantCapability\(/);
  });
});
''')

          server_import = """import {\n  ParticipantSession,\n  normalizeNickname,\n  normalizeParticipantId,\n} from './participant-session.js';\n"""
          replace_once(
              'src/server.ts',
              server_import,
              server_import + "import { ParticipantCapabilityRegistry, normalizeParticipantCapability } from './participant-capability.js';\n",
          )
          replace_once(
              'src/server.ts',
              "const participants = new ParticipantSession(PARTICIPANT_GRACE_MS);\nconst youtubeTimeline = new SongSession();",
              "const participants = new ParticipantSession(PARTICIPANT_GRACE_MS);\nconst participantCapabilities = new ParticipantCapabilityRegistry();\nconst youtubeTimeline = new SongSession();",
          )
          replace_once(
              'src/server.ts',
              """function participantIdentity(request: IncomingMessage) {\n  const url = new URL(request.url ?? '/', `http://${request.headers.host ?? 'localhost'}`);\n  const participantId = normalizeParticipantId(url.searchParams.get('participant'));\n  if (!participantId) return null;\n\n  const nickname = normalizeNickname(url.searchParams.get('name')) ?? 'Guest';\n  return { participantId, nickname };\n}\n""",
              """function participantIdentity(request: IncomingMessage) {\n  const url = new URL(request.url ?? '/', `http://${request.headers.host ?? 'localhost'}`);\n  const participantId = normalizeParticipantId(url.searchParams.get('participant'));\n  const capability = normalizeParticipantCapability(url.searchParams.get('cap'));\n  if (!participantId || !capability) return null;\n\n  const nickname = normalizeNickname(url.searchParams.get('name')) ?? 'Guest';\n  return { participantId, nickname, capability };\n}\n""",
          )
          replace_once(
              'src/server.ts',
              """  const identity = participantIdentity(request);\n  if (identity) {\n    participantConnectionSequence += 1;\n    socket.participantId = identity.participantId;\n    socket.participantConnectionId = `connection-${participantConnectionSequence}`;\n    const changed = participants.attach({\n      connectionId: socket.participantConnectionId,\n      participantId: identity.participantId,\n      nickname: identity.nickname,\n      nowMs: Date.now(),\n    });\n    if (changed) broadcastSessionStatus();\n    else sendJson(socket, sessionStatusPayload());\n  }\n""",
              """  const identity = participantIdentity(request);\n  if (identity) {\n    if (!participantCapabilities.claim(identity.participantId, identity.capability)) {\n      sendJson(socket, {\n        type: 'participant-auth-rejected',\n        message: 'This participant identity belongs to another browser capability.',\n      });\n      socket.close(1008, 'Participant capability mismatch.');\n      return;\n    }\n\n    participantConnectionSequence += 1;\n    socket.participantId = identity.participantId;\n    socket.participantConnectionId = `connection-${participantConnectionSequence}`;\n    const changed = participants.attach({\n      connectionId: socket.participantConnectionId,\n      participantId: identity.participantId,\n      nickname: identity.nickname,\n      nowMs: Date.now(),\n    });\n    if (changed) broadcastSessionStatus();\n    else sendJson(socket, sessionStatusPayload());\n  }\n""",
          )

          replace_once(
              'public/presence.js',
              """  const PARTICIPANT_ID_KEY = 'relay.participantId.v1';\n  const NICKNAME_KEY = 'relay.nickname.v1';\n""",
              """  const PARTICIPANT_ID_KEY = 'relay.participantId.v1';\n  const PARTICIPANT_CAPABILITY_KEY = 'relay.participantCapability.v1';\n  const NICKNAME_KEY = 'relay.nickname.v1';\n""",
          )
          replace_once(
              'public/presence.js',
              """  function randomParticipantId() {\n    const random = new Uint32Array(4);\n    crypto.getRandomValues(random);\n    return `participant-${Array.from(random, (value) => value.toString(16).padStart(8, '0')).join('')}`;\n  }\n\n  function storedIdentity() {\n""",
              """  function randomParticipantId() {\n    const random = new Uint32Array(4);\n    crypto.getRandomValues(random);\n    return `participant-${Array.from(random, (value) => value.toString(16).padStart(8, '0')).join('')}`;\n  }\n\n  function randomParticipantCapability() {\n    const random = new Uint8Array(32);\n    crypto.getRandomValues(random);\n    return Array.from(random, (value) => value.toString(16).padStart(2, '0')).join('');\n  }\n\n  function storedIdentity() {\n""",
          )
          replace_once(
              'public/presence.js',
              """    let nickname = normalizeNickname(localStorage.getItem(NICKNAME_KEY));\n    if (!nickname) {\n      nickname = randomNickname();\n      localStorage.setItem(NICKNAME_KEY, nickname);\n    }\n    return { participantId, nickname };\n  }\n\n  let { participantId, nickname } = storedIdentity();\n""",
              """    let participantCapability = localStorage.getItem(PARTICIPANT_CAPABILITY_KEY);\n    if (!participantCapability || !/^[0-9a-f]{64}$/.test(participantCapability)) {\n      participantCapability = randomParticipantCapability();\n      localStorage.setItem(PARTICIPANT_CAPABILITY_KEY, participantCapability);\n    }\n\n    let nickname = normalizeNickname(localStorage.getItem(NICKNAME_KEY));\n    if (!nickname) {\n      nickname = randomNickname();\n      localStorage.setItem(NICKNAME_KEY, nickname);\n    }\n    return { participantId, participantCapability, nickname };\n  }\n\n  let { participantId, participantCapability, nickname } = storedIdentity();\n""",
          )
          replace_once(
              'public/presence.js',
              """  window.relayParticipantId = participantId;\n  window.relayNickname = nickname;\n""",
              """  window.relayParticipantId = participantId;\n  window.relayParticipantCapability = participantCapability;\n  window.relayNickname = nickname;\n""",
          )
          replace_once(
              'public/presence.js',
              """    params.set('participant', participantId);\n    params.set('name', nickname);\n""",
              """    params.set('participant', participantId);\n    params.set('cap', participantCapability);\n    params.set('name', nickname);\n""",
          )

          shared_old = """    const nickname = typeof window.relayNickname === 'string'\n      ? window.relayNickname.trim()\n      : '';\n    if (participantId && nickname) {\n      params.set('participant', participantId);\n      params.set('name', nickname);\n    }\n"""
          shared_new = """    const nickname = typeof window.relayNickname === 'string'\n      ? window.relayNickname.trim()\n      : '';\n    const participantCapability = typeof window.relayParticipantCapability === 'string'\n      ? window.relayParticipantCapability.trim()\n      : '';\n    if (participantId && nickname && participantCapability) {\n      params.set('participant', participantId);\n      params.set('cap', participantCapability);\n      params.set('name', nickname);\n    }\n"""
          for path in [
              'public/app.js',
              'public/listen.js',
              'public/live-status.js',
              'public/system-details.js',
              'public/youtube-sync.js',
          ]:
              replace_once(path, shared_old, shared_new)

          replace_once(
              'public/recorder.js',
              """  const participantId = typeof window.relayParticipantId === 'string'\n    ? window.relayParticipantId\n    : '';\n  if (!participantId) return null;\n""",
              """  const participantId = typeof window.relayParticipantId === 'string'\n    ? window.relayParticipantId\n    : '';\n  const participantCapability = typeof window.relayParticipantCapability === 'string'\n    ? window.relayParticipantCapability\n    : '';\n  if (!participantId || !participantCapability) return null;\n""",
          )
          replace_once(
              'public/recorder.js',
              """  params.set('participant', participantId);\n  params.set('name', typeof window.relayNickname === 'string' ? window.relayNickname : 'Guest');\n""",
              """  params.set('participant', participantId);\n  params.set('cap', participantCapability);\n  params.set('name', typeof window.relayNickname === 'string' ? window.relayNickname : 'Guest');\n""",
          )
          PY

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/one-shot-participant-capability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts src/participant-capability.ts public/presence.js public/app.js public/listen.js public/live-status.js public/system-details.js public/recorder.js public/youtube-sync.js test/participant-capability.test.ts .github/workflows/one-shot-participant-capability.yml
          git diff --cached --check
          git commit -m "fix: bind participant authority to a private capability"
          git push origin HEAD:agent/stabilize-room-kernel
