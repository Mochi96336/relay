name: Repair pitch ribbon critical path

on:
  push:
    branches:
      - agent/live-p0-pitch-ribbon
    paths:
      - scripts/repair-pitch-ribbon-critical-path.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/live-p0-pitch-ribbon
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - name: Apply scoped repair
        run: node scripts/repair-pitch-ribbon-critical-path.mjs
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/capture-worklet.js test/capture-worklet-level.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "fix(audio): keep pitch analysis off PCM delivery path"
          git push origin HEAD:agent/live-p0-pitch-ribbon
