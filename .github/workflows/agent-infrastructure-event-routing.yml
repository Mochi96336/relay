name: Agent infrastructure event routing construction

on:
  push:
    branches:
      - agent/server-infrastructure-event-routing

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Move only infrastructure event routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text()

          import_anchor = "import { createRelayCommandProtocol } from './relay-command-protocol.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('command protocol import anchor changed')
          text = text.replace(
              import_anchor,
              import_anchor + "import { createRelayInfrastructureEventProtocol } from './relay-infrastructure-event-protocol.js';\n",
              1,
          )

          def extract_handler(text, header, next_marker, handler_name):
              start = text.index(header)
              end = text.index(next_marker, start)
              block = text[start:end].rstrip()
              inner = block[len(header):]
              if not inner.endswith('    }'):
                  raise SystemExit(f'{handler_name} block ending changed')
              inner = inner[:-5]
              dedented = ''.join(
                  line[2:] if line.startswith('  ') else line
                  for line in inner.splitlines(keepends=True)
              )
              handler = f"  {handler_name}: (socket, payload) => {{\n" + dedented + "  },"
              return text[:start] + text[end:], handler

          text, boundary_handler = extract_handler(
              text,
              "    if (payload.type === 'backing-sample-boundary') {\n",
              "    if (payload.type === 'infrastructure-authenticate') {",
              'backingSampleBoundary',
          )
          text, offset_handler = extract_handler(
              text,
              "    if (payload.type === 'robot-player-offset') {\n",
              "\n\n\n  });",
              'robotPlayerOffset',
          )

          protocol_anchor = "\n\n});\n\nlet shuttingDown = false;"
          if text.count(protocol_anchor) != 1:
              raise SystemExit('command protocol closing anchor changed')
          infrastructure_protocol = (
              "\n\n});\n\n"
              "const infrastructureEventProtocol = createRelayInfrastructureEventProtocol<RelaySocket>({\n"
              + boundary_handler + "\n"
              + offset_handler + "\n"
              + "});\n\nlet shuttingDown = false;"
          )
          text = text.replace(protocol_anchor, infrastructure_protocol, 1)

          dispatch_anchor = "    if (commandProtocol.dispatch(socket, payload)) return;\n"
          if text.count(dispatch_anchor) != 1:
              raise SystemExit('command dispatch anchor changed')
          text = text.replace(
              dispatch_anchor,
              dispatch_anchor + "    if (infrastructureEventProtocol.dispatch(socket, payload)) return;\n",
              1,
          )

          for forbidden in (
              "payload.type === 'backing-sample-boundary'",
              "payload.type === 'robot-player-offset'",
          ):
              if forbidden in text:
                  raise SystemExit(f'inline selector remains: {forbidden}')

          for marker in (
              'createRelayInfrastructureEventProtocol<RelaySocket>',
              'backingSampleBoundary: (socket, payload) => {',
              'backingRuntime.isSocket(socket)',
              "socket.role !== 'backing'",
              '!backingRuntime.isRobot',
              'robotContentTransitionRuntime.acceptBackingBoundary({',
              'robotPlayerOffset: (socket, payload) => {',
              'sourceRuntime.isActiveRobot(socket)',
              'robotPlayerOffset.record(offsetMs, nowMs)',
              'robotContentTimeline.notePlayerOffset(',
              'if (mapped) requestRobotBackingBoundary(nowMs)',
              'infrastructureEventProtocol.dispatch(socket, payload)',
          ):
              if marker not in text:
                  raise SystemExit(f'missing retained infrastructure marker: {marker}')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Focused infrastructure routing tests
        run: >-
          node --import tsx --test --test-concurrency=1
          test/relay-infrastructure-event-protocol.test.ts
          test/server-infrastructure-event-protocol-routing.test.ts
          test/backing-sample-boundary.test.ts
          test/robot-player-offset.test.ts
          test/infrastructure-authority.test.ts
          test/timing-validity.test.ts
          test/robot-content-live-boundary.test.ts
      - name: Verify diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/server.ts src/relay-infrastructure-event-protocol.ts test/relay-infrastructure-event-protocol.test.ts test/server-infrastructure-event-protocol-routing.test.ts
      - name: Commit validated server wiring
        shell: bash
        run: |
          rm .github/workflows/agent-infrastructure-event-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/agent-infrastructure-event-routing.yml
          git commit -m 'refactor(server): route infrastructure observations through protocol'
          git push origin HEAD:agent/server-infrastructure-event-routing
