# Retrigger on the latest branch head after unrelated concurrent workflow work landed.
name: One-shot authority release and status wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/authority-release-status-once.yml

permissions:
  contents: write

concurrency:
  group: relay-authority-release-status-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact authority wiring
        run: |
          python3 .github/authority-release-status.py
          python3 .github/authority-ordering-fix.py

      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/server.ts test/runtime-single-snapshot.test.ts test/webtransport-media-server.test.ts

      - run: npm ci
      - run: npm run check
      - name: Run full suite before writing branch
        run: npm test

      - name: Commit verified product wiring
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/server.ts test/runtime-single-snapshot.test.ts test/webtransport-media-server.test.ts
          git diff --cached --check
          git commit -m 'refactor: wire mic release effects and remote status'

          # Concurrent stabilization commits have repeatedly touched only .github.
          # Rebase the already-verified product commit onto the latest branch head;
          # a real product-file collision becomes a normal rebase conflict and stops
          # here instead of overwriting newer work.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
