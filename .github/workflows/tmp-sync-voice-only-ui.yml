name: Temporary sync voice-only UI

on:
  push:
    branches:
      - agent/live-ui-shell
    paths:
      - scripts/tmp-sync-voice-only-ui.mjs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Merge verified runtime base
        run: |
          git fetch origin agent/runtime-product-status
          git merge --no-commit --no-ff origin/agent/runtime-product-status
      - name: Apply voice-only presentation contracts
        run: node scripts/tmp-sync-voice-only-ui.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Browser JavaScript syntax
        run: |
          for file in public/*.js; do node --check "$file"; done
      - name: Launcher shell syntax
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Full test suite
        run: npm test
      - name: Commit verified stack sync
        run: |
          rm scripts/tmp-sync-voice-only-ui.mjs
          rm .github/workflows/tmp-sync-voice-only-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): support voice-only Live sessions"
          git push origin HEAD:agent/live-ui-shell
