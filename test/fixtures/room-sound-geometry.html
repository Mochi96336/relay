<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Relay Room sound geometry</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/live-state.css" />
  <link rel="stylesheet" href="/adjust.css" />
  <link rel="stylesheet" href="/live-ia.css" />
</head>
<body data-listen="audible">
  <main class="live-shell">
    <footer class="live-actions">
      <section class="local-listen local-sound-control" aria-labelledby="local-listen-label">
        <div class="adjust-group-heading">
          <span id="local-listen-label" class="section-label">Room sound</span>
          <span>This device only</span>
          <button id="listen-toggle" class="text-action" type="button" aria-pressed="false" aria-label="Mute">
            <svg class="room-sound-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 10h3l4-3v10l-4-3H5z" />
              <g data-room-sound-signal="audible">
                <path d="M15 9.5c1.4 1.4 1.4 3.6 0 5" />
                <path d="M17.7 7.4c2.6 2.6 2.6 6.6 0 9.2" />
              </g>
              <g data-room-sound-signal="muted">
                <path d="M15.5 9.5l4 5m0-5l-4 5" />
              </g>
              <g data-room-sound-signal="retry">
                <path d="M19.5 8.5v-3l-2 2" />
                <path d="M19.4 6.1a5 5 0 1 0 1.2 6.7" />
              </g>
            </svg>
          </button>
        </div>
        <label class="adjust-control" for="listen-gain">
          <div class="adjust-row-heading">
            <strong>Volume</strong>
            <output id="listen-gain-value" for="listen-gain">100%</output>
          </div>
          <input id="listen-gain" class="adjust-range" type="range" min="0" max="100" step="1" value="100" />
        </label>
        <p id="listen-adjust-state" class="adjust-helper"></p>
        <span id="listen-note" class="action-note" aria-live="polite"></span>
      </section>
    </footer>
  </main>

  <script src="/i18n.js"></script>
  <script>
    window.relayI18n.setLocale('zh-Hant', { persist: false });
    window.relayListenState = {
      state: 'audible',
      phase: 'playing',
      muted: false,
      forcedReason: null,
      volumePercent: 100,
    };
  </script>
  <script type="module" src="/room-sound-ui.js"></script>
</body>
</html>
