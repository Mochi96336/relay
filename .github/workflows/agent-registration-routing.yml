name: Agent registration routing construction

on:
  push:
    branches:
      - agent/server-registration-routing

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/server-registration-routing
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Move registration selection behind protocol seam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          source = path.read_text()

          import_anchor = "import { createRelayAuthenticationProtocol } from './relay-authentication-protocol.js';\n"
          registration_import = "import { createRelayRegistrationProtocol } from './relay-registration-protocol.js';\n"
          assert source.count(import_anchor) == 1
          assert registration_import not in source
          source = source.replace(import_anchor, import_anchor + registration_import, 1)

          markers = {
              'publisher': "    if (payload.type === 'register' && payload.role === 'publisher') {\n",
              'backing': "    if (payload.type === 'register' && payload.role === 'backing') {\n",
              'monitor': "    if (payload.type === 'register' && payload.role === 'monitor') {\n",
          }
          robot_marker = "    if (payload.type === 'robot-source-hello') {\n"
          for marker in markers.values():
              assert source.count(marker) == 1
          assert source.count(robot_marker) == 1

          starts = {name: source.index(marker) for name, marker in markers.items()}
          robot_start = source.index(robot_marker)
          assert starts['publisher'] < starts['backing'] < starts['monitor'] < robot_start

          bounds = {
              'publisher': (starts['publisher'], starts['backing']),
              'backing': (starts['backing'], starts['monitor']),
              'monitor': (starts['monitor'], robot_start),
          }

          bodies = {}
          for name, (start, end) in bounds.items():
              chunk = source[start:end]
              prefix = markers[name]
              assert chunk.startswith(prefix)
              assert chunk.endswith("    }\n\n")
              body = chunk[len(prefix):-len("    }\n\n")]
              body = ''.join(line[2:] if line.startswith('  ') else line for line in body.splitlines(keepends=True))
              bodies[name] = body

          source = source[:starts['publisher']] + source[robot_start:]

          auth_start = source.index('const authenticationProtocol = createRelayAuthenticationProtocol<RelaySocket>({')
          auth_boundary = "\n});\n\nlet shuttingDown = false;"
          auth_end = source.index(auth_boundary, auth_start)

          registration = (
              "\n});\n\n"
              "const registrationProtocol = createRelayRegistrationProtocol<RelaySocket>({\n"
              "  publisher: (socket, payload) => {\n" + bodies['publisher'] + "  },\n"
              "  backing: (socket, payload) => {\n" + bodies['backing'] + "  },\n"
              "  monitor: (socket, payload) => {\n" + bodies['monitor'] + "  },\n"
              "});\n\n"
              "let shuttingDown = false;"
          )
          source = source[:auth_end] + registration + source[auth_end + len(auth_boundary):]

          dispatch_anchor = "    if (authenticationProtocol.dispatch(socket, payload)) return;\n"
          registration_dispatch = "    if (registrationProtocol.dispatch(socket, payload)) return;\n"
          assert source.count(dispatch_anchor) == 1
          assert registration_dispatch not in source
          source = source.replace(dispatch_anchor, dispatch_anchor + registration_dispatch, 1)

          for marker in markers.values():
              assert marker not in source
          assert source.count(robot_marker) == 1
          assert source.count('createRelayRegistrationProtocol<RelaySocket>') == 1
          assert source.count('registrationProtocol.dispatch(socket, payload)') == 1

          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Focused registration and authority proof
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/relay-registration-protocol.test.ts \
            test/server-registration-protocol-routing.test.ts \
            test/server-authentication-protocol-routing.test.ts \
            test/server-infrastructure-event-protocol-routing.test.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/infrastructure-authority.test.ts \
            test/mic-boundary-hardening-server.test.ts \
            test/command-authority-server.test.ts

      - name: Diff check
        run: git diff --check

      - name: Commit server move and remove construction workflow
        run: |
          rm .github/workflows/agent-registration-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/agent-registration-routing.yml
          git diff --cached --check
          git commit -m 'refactor(server): route registration through protocol'
          git push origin HEAD:agent/server-registration-routing
