name: Socket role authority one-shot

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/socket-role-authority.py
      - .github/socket-role-authority-testfix.py
      - .github/workflows/socket-role-authority-once.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Apply exact socket-role patch
        run: |
          python .github/socket-role-authority.py
          python .github/socket-role-authority-testfix.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Browser syntax check
        run: node --check public/source.js

      - name: Full test suite
        run: npm test

      - name: Refuse stale-head publication
        run: |
          git fetch origin agent/stabilize-room-kernel
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/stabilize-room-kernel)"

      - name: Remove one-shot gate
        run: |
          rm .github/socket-role-authority.py
          rm .github/socket-role-authority-testfix.py
          rm .github/workflows/socket-role-authority-once.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make WebSocket transport roles immutable"
          git push origin HEAD:agent/stabilize-room-kernel
