name: One-shot core stabilization wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/server-wiring-once.py
      - .github/workflows/server-wiring-once.yml

permissions:
  contents: write

concurrency:
  group: relay-server-wiring-once
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Apply exact stabilization replacements
        run: python3 .github/server-wiring-once.py
      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          git diff -- \
            src/server.ts \
            src/audio-packet-receiver.ts \
            public/app.js \
            public/listen.js \
            test/probe-server-lifecycle.test.ts \
            test/audio-packet-server.test.ts
          for file in \
            src/server.ts \
            src/audio-packet-receiver.ts \
            public/app.js \
            public/listen.js \
            test/probe-server-lifecycle.test.ts \
            test/audio-packet-server.test.ts
          do
            git status --short -- "$file" | grep -q .
          done
      - run: npm ci
      - run: npm run check
      - name: Run full tests before writing branch
        run: npm test
      - name: Commit only validated stabilization changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/server.ts \
            src/audio-packet-receiver.ts \
            public/app.js \
            public/listen.js \
            test/probe-server-lifecycle.test.ts \
            test/audio-packet-server.test.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m 'fix: recover restart and mobile audio authority'
          git pull --rebase origin agent/stabilize-room-kernel
          git push origin HEAD:agent/stabilize-room-kernel
