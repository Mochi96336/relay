name: Temporary voice-only runtime refactor

on:
  push:
    branches:
      - agent/runtime-product-status
    paths:
      - scripts/tmp-voice-only-runtime.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply exact voice-only runtime refactor
        run: node scripts/tmp-voice-only-runtime.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Browser JavaScript syntax
        run: |
          for file in public/*.js; do node --check "$file"; done
      - name: Full test suite
        run: npm test
      - name: Commit verified runtime change
        run: |
          rm scripts/tmp-voice-only-runtime.mjs
          rm .github/workflows/tmp-voice-only-runtime.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No product changes produced'; exit 1; }
          git commit -m "fix(runtime): support voice-only rooms"
          git push origin HEAD:agent/runtime-product-status
