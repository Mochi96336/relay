name: One-shot authority hardening

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/authority-hardening-once.yml

permissions:
  contents: write

concurrency:
  group: relay-authority-hardening-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply authority hardening patch
        run: python3 .github/authority-hardening-once.py

      - name: Verify focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/participant-capability.ts \
            src/room-song-command-session.ts \
            test/helpers/harness.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/room-song-command.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Run focused authority tests
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/room-song-command.test.ts \
            test/room-song-command-server.test.ts \
            test/song-authority-server.test.ts

      - name: Run full suite
        run: npm test

      - name: Commit tested product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/participant-capability.ts \
            src/room-song-command-session.ts \
            test/helpers/harness.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/room-song-command.test.ts
          git commit -m 'fix: close participant and stale playback authority gaps'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
