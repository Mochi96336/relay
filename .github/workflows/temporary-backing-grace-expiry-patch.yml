name: Temporary Backing grace expiry patch

on:
  push:
    branches:
      - agent/backing-grace-expiry-coordinator

permissions:
  contents: write

jobs:
  exact-server-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/backing-grace-expiry-coordinator
          fetch-depth: 1
      - name: Patch exact server grace-expiry seam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { createRelayBackingDisconnectCoordinator } from './relay-backing-disconnect-coordinator.js';\n"
          new_import = "import { createRelayBackingGraceExpiryCoordinator } from './relay-backing-grace-expiry-coordinator.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f'expected one import anchor, found {text.count(import_anchor)}')
          if text.count(new_import) != 0:
              raise SystemExit('Backing grace expiry coordinator import already exists')
          text = text.replace(import_anchor, import_anchor + new_import, 1)

          old_function = """function expireBackingGrace() {
  const micArmed = micRuntime.controlConnected()
    || webTransportMicConnected()
    || micTransportGrace.pending;
  if (roomHasSong() || !micArmed) {
    stopLiveSource();
    return;
  }

  backingRuntime.retireRobotRoute();
  clearRobotBackingBoundaryRequest();
  invalidateMicTiming('Backing route ended while the room continued voice-only.');
  broadcastStatus();
}
"""
          if text.count(old_function) != 1:
              raise SystemExit(f'expected exact old expireBackingGrace once, found {text.count(old_function)}')

          replacement = """const backingGraceExpiryCoordinator = createRelayBackingGraceExpiryCoordinator({
  stopLiveSource: () => stopLiveSource(),
  retireRobotRoute: () => backingRuntime.retireRobotRoute(),
  clearRobotBackingBoundaryRequest: () => clearRobotBackingBoundaryRequest(),
  invalidateMicTiming: (message) => invalidateMicTiming(message),
  reportStatus: () => broadcastStatus(),
});

function expireBackingGrace() {
  const micArmed = micRuntime.controlConnected()
    || webTransportMicConnected()
    || micTransportGrace.pending;
  backingGraceExpiryCoordinator.expire({
    roomHasSong: roomHasSong(),
    micArmed,
  });
}
"""
          text = text.replace(old_function, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/server.ts"
          test "$(git diff --numstat src/server.ts | awk '{print $1}')" -lt 30
          test "$(git diff --numstat src/server.ts | awk '{print $2}')" -lt 30
          git diff -- src/server.ts
      - name: Commit exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          git commit -m 'refactor(backing): delegate grace expiry policy'
          git push origin HEAD:agent/backing-grace-expiry-coordinator
