name: Agent CI flake hardening

on:
  push:
    branches:
      - agent/ci-flake-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Harden flaky test synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          validation_path = Path('test/content-calibration-validation-server.test.ts')
          text = validation_path.read_text()
          old = (
              "async function waitForValidationCollection(monitor: RelayClient, fromIndex: number) {\n"
              "  return waitForNewMessage(\n"
              "    monitor,\n"
              "    fromIndex,\n"
              "    (m) => m.type === 'timing-calibration-status'\n"
              "      && m.validation?.state === 'collecting',\n"
              "    4_000,\n"
              "  );\n"
              "}\n"
          )
          new = (
              "async function waitForValidationCollection(\n"
              "  monitor: RelayClient,\n"
              "  fromIndex: number,\n"
              "  backing: RelayClient,\n"
              "  publisher: RelayClient,\n"
              "  timeoutMs = 8_000,\n"
              ") {\n"
              "  const deadline = Date.now() + timeoutMs;\n"
              "  while (Date.now() < deadline) {\n"
              "    const found = monitor.messages.slice(fromIndex).find(\n"
              "      (m) => m.type === 'timing-calibration-status'\n"
              "        && m.validation?.state === 'collecting',\n"
              "    );\n"
              "    if (found) return found;\n"
              "\n"
              "    // Keep the same production readiness signals fresh while CI is\n"
              "    // CPU-bound, and request canonical status so the test cannot miss\n"
              "    // the collecting transition merely because a scheduler tick slipped.\n"
              "    refreshLivePath(backing, publisher);\n"
              "    monitor.send({ type: 'timing-calibration-status-request' });\n"
              "    await sleep(100);\n"
              "  }\n"
              "  throw new Error(\n"
              "    `Timed out waiting for validation collection. Saw: ${monitor.messages\n"
              "      .slice(fromIndex)\n"
              "      .map((m) => `${m.type}:${m.validation?.state ?? ''}`)\n"
              "      .join(', ')}`,\n"
              "  );\n"
              "}\n"
          )
          if old not in text:
              raise SystemExit('validation helper marker missing')
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r"waitForValidationCollection\(monitor, ([A-Za-z]+)\);",
              r"waitForValidationCollection(monitor, \1, backing, publisher);",
              text,
          )
          if count != 6:
              raise SystemExit(f'expected 6 validation call sites, found {count}')
          validation_path.write_text(text)

          take_path = Path('test/take-position.test.ts')
          text = take_path.read_text()
          directory_markers = [
              "  const directory = await mkdtemp(path.join(os.tmpdir(), 'relay-take-position-'));\n",
              "  const directory = await mkdtemp(path.join(os.tmpdir(), 'relay-take-position-gap-'));\n",
              "  const directory = await mkdtemp(path.join(os.tmpdir(), 'relay-take-position-rapid-'));\n",
          ]
          for marker in directory_markers:
              if marker not in text:
                  raise SystemExit(f'take directory marker missing: {marker.strip()}')
              text = text.replace(marker, marker + "  let controller: TakeController | null = null;\n", 1)

          old_setup = "    const { controller, ready } = waitForReady(directory);\n"
          new_setup = (
              "    const setup = waitForReady(directory);\n"
              "    controller = setup.controller;\n"
              "    const { ready } = setup;\n"
          )
          if text.count(old_setup) != 3:
              raise SystemExit(f'expected 3 Take controller setup sites, found {text.count(old_setup)}')
          text = text.replace(old_setup, new_setup)

          old_finally = (
              "  } finally {\n"
              "    await rm(directory, { recursive: true, force: true });\n"
              "  }\n"
              "});\n"
          )
          new_finally = (
              "  } finally {\n"
              "    // ready is emitted before the retention-prune chain finishes. Drain\n"
              "    // all controller-owned async work before deleting the fixture root.\n"
              "    if (controller) await controller.shutdown();\n"
              "    await rm(directory, { recursive: true, force: true });\n"
              "  }\n"
              "});\n"
          )
          if text.count(old_finally) != 3:
              raise SystemExit(f'expected 3 Take cleanup sites, found {text.count(old_finally)}')
          text = text.replace(old_finally, new_finally)
          take_path.write_text(text)
          PY
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Repeat content validation server test
        run: |
          for i in $(seq 1 6); do
            echo "content validation repetition $i"
            node --import tsx --test --test-concurrency=1 test/content-calibration-validation-server.test.ts
          done
      - name: Repeat Take position test
        run: |
          for i in $(seq 1 20); do
            echo "Take position repetition $i"
            node --import tsx --test --test-concurrency=1 test/take-position.test.ts
          done
      - name: Diff check
        run: git diff --check
      - name: Commit hardened tests and remove construction workflow
        run: |
          rm .github/workflows/agent-ci-flake-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/content-calibration-validation-server.test.ts test/take-position.test.ts .github/workflows/agent-ci-flake-hardening.yml
          git commit -m 'test: harden timing and Take cleanup synchronization'
          git push origin HEAD:agent/ci-flake-hardening
