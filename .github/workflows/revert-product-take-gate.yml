name: Revert product Take gate

on:
  push:
    branches:
      - agent/live-ui-shell
    paths:
      - scripts/revert-product-take-gate.mjs
      - .github/workflows/revert-product-take-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/live-ui-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/live-ui-shell
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - name: Restore command boundary
        run: node scripts/revert-product-take-gate.mjs
      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          rm scripts/revert-product-take-gate.mjs
          rm .github/workflows/revert-product-take-gate.yml
          git config user.name 'relay-ui-wiring[bot]'
          git config user.email 'relay-ui-wiring[bot]@users.noreply.github.com'
          git add src/server.ts scripts/revert-product-take-gate.mjs .github/workflows/revert-product-take-gate.yml
          git commit -m 'fix: keep product Take gating at the UI boundary'
          git push origin HEAD:agent/live-ui-shell
