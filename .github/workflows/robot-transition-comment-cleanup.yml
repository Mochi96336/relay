name: Robot transition comment cleanup

on:
  pull_request:
    branches:
      - agent/correctness-repair

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/robot-transition-bounds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-transition-bounds
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - name: Restore comment-only base deletions
        run: |
          git fetch origin agent/correctness-repair
          cp src/server.ts /tmp/server-before.ts
          python3 - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          import subprocess

          current_path = Path('src/server.ts')
          current = current_path.read_text().splitlines(keepends=True)
          base = subprocess.check_output(
              ['git', 'show', 'origin/agent/correctness-repair:src/server.ts'],
              text=True,
          ).splitlines(keepends=True)

          def comment_only(line: str) -> bool:
              stripped = line.strip()
              return (
                  stripped == ''
                  or stripped.startswith('//')
                  or stripped.startswith('/*')
                  or stripped.startswith('*')
                  or stripped == '*/'
              )

          matcher = SequenceMatcher(a=base, b=current, autojunk=False)
          output = []
          restored = 0
          for tag, i1, i2, j1, j2 in matcher.get_opcodes():
              if tag in ('equal', 'insert'):
                  output.extend(current[j1:j2])
                  continue
              if tag == 'delete':
                  deleted = base[i1:i2]
                  if deleted and all(comment_only(line) for line in deleted):
                      output.extend(deleted)
                      restored += len(deleted)
                  continue

              deleted = base[i1:i2]
              replacement = current[j1:j2]
              lead = 0
              while lead < len(deleted) and comment_only(deleted[lead]):
                  lead += 1
              trail = len(deleted)
              while trail > lead and comment_only(deleted[trail - 1]):
                  trail -= 1
              leading = deleted[:lead]
              trailing = deleted[trail:]
              if leading and not all(line in replacement for line in leading):
                  output.extend(leading)
                  restored += len(leading)
              output.extend(replacement)
              if trailing and not all(line in replacement for line in trailing):
                  output.extend(trailing)
                  restored += len(trailing)

          current_path.write_text(''.join(output))
          print(f'restored {restored} comment/blank lines')
          PY
      - name: Prove cleanup only inserts comments
        run: |
          python3 - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path

          before = Path('/tmp/server-before.ts').read_text().splitlines(keepends=True)
          after = Path('src/server.ts').read_text().splitlines(keepends=True)

          def comment_only(line: str) -> bool:
              stripped = line.strip()
              return (
                  stripped == ''
                  or stripped.startswith('//')
                  or stripped.startswith('/*')
                  or stripped.startswith('*')
                  or stripped == '*/'
              )

          inserted = 0
          for tag, i1, i2, j1, j2 in SequenceMatcher(a=before, b=after, autojunk=False).get_opcodes():
              if tag == 'equal':
                  continue
              if tag != 'insert':
                  raise SystemExit(f'cleanup changed existing text: {tag} before[{i1}:{i2}] after[{j1}:{j2}]')
              lines = after[j1:j2]
              if not lines or not all(comment_only(line) for line in lines):
                  raise SystemExit(f'cleanup inserted non-comment text at after[{j1}:{j2}]')
              inserted += len(lines)
          print(f'verified insertion-only cleanup: {inserted} comment/blank lines')
          PY
      - name: Typecheck
        run: npm run check
      - name: Commit cleanup and remove helper workflow
        run: |
          rm .github/workflows/robot-transition-comment-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts .github/workflows/robot-transition-comment-cleanup.yml
          git commit -m 'chore: clean robot transition diff noise'
          git push origin HEAD:agent/robot-transition-bounds
