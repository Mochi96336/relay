name: Temporary exact server coverage patch

on:
  push:
    branches:
      - agent/mic-underdelivery-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mic-underdelivery-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text()
          replacements = [
              (
                  "  streamLiveMs: STREAM_LIVE_MS,\n  createDirectMediaTicket: () => webTransportMedia.createTicket(),",
                  "  streamLiveMs: STREAM_LIVE_MS,\n  acceptedSampleRate: MIX_SAMPLE_RATE,\n  createDirectMediaTicket: () => webTransportMedia.createTicket(),",
              ),
              (
                  "function noteMicFrame(nowMs: number) {\n  micRuntime.noteFrame(nowMs);\n}",
                  "function noteMicFrame(nowMs: number, acceptedSamples: number) {\n  micRuntime.noteFrame(nowMs, acceptedSamples);\n}",
              ),
              (
                  "    if (samples.length > 0) noteMicFrame(nowMs);",
                  "    if (samples.length > 0) noteMicFrame(nowMs, samples.length);",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify only intended server lines changed
        run: |
          git diff --check
          git diff -- src/server.ts
          test "$(git diff --numstat -- src/server.ts | awk '{print $1+$2}')" -eq 5
      - name: Commit patch and retire temporary workflow
        run: |
          rm .github/workflows/patch-server-underdelivery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts .github/workflows/patch-server-underdelivery.yml
          git commit -m "feat(audio): count post-session Mic sample coverage"
          git push origin HEAD:agent/mic-underdelivery-recovery
