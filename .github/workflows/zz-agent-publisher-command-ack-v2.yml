name: Agent publisher command ACK freshness v2

on:
  push:
    branches:
      - agent/correctness-publisher-command-freshness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/correctness-publisher-command-freshness
          fetch-depth: 0
      - name: Apply clean publisher ACK freshness patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout 97e849362a715b3896f3aba13bd6362bdc194fe8 -- public/participant-auth.js
          rm -f public/publisher-control-liveness.js
          rm -f test/publisher-control-browser-liveness.test.ts
          rm -f .agent-publisher-command-ack-trigger
          python3 .agent-publisher-command-ack.py
          rm -f .agent-publisher-command-ack.py
          rm -f .github/workflows/zz-agent-publisher-command-ack.yml
          rm -f .github/workflows/zz-agent-publisher-command-ack-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(mic): prove publisher command round trip'
          git push origin HEAD:agent/correctness-publisher-command-freshness
