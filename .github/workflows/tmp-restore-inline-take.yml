name: Temporary restore inline Take markup

on:
  push:
    branches:
      - agent/live-ui-shell
    paths:
      - scripts/tmp-restore-inline-take.mjs

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Configure commit identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Restore last known-good Live markup
        run: |
          git show 7fd34141e92f813b8939b45b111392ad44f76295:public/index.html > public/index.html
          node scripts/tmp-restore-inline-take.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Full test suite
        run: npm test
      - name: Commit verified markup repair
        run: |
          rm scripts/tmp-restore-inline-take.mjs
          rm .github/workflows/tmp-restore-inline-take.yml
          git add -A
          git commit -m "fix(ui): preserve Live structure around Last take"
          git push origin HEAD:agent/live-ui-shell
