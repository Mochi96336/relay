name: Temporary media-recovery path-transition rebuild

on:
  push:
    branches:
      - agent/media-recovery-path-transition-fence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/media-recovery-path-transition-fence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact latest-main path attribution fence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/mic-media-path-recovery.js')
          text = path.read_text()
          replacements = [
              (
                  """    this.captureGeneration = null;\n    this.currentSocketEpoch = null;\n    this.lastCapturedSamples = null;""",
                  """    this.captureGeneration = null;\n    this.currentSocketEpoch = null;\n    this.lastLocalPath = null;\n    this.lastCapturedSamples = null;""",
              ),
              (
                  """    if (this.currentSocketEpoch !== null && normalizedEpoch !== this.currentSocketEpoch) {\n      // #304/control lifecycle owns physical socket replacement. Never let ACK\n      // cadence from the retired socket count toward a media verdict.\n      this.rebaseline({\n        capturedSamples: captured,\n        serverAcceptedFrameSerial: acceptedSerial,\n        socketEpoch: normalizedEpoch,\n        ...packetCounters,\n      });\n      if (this.phase === 'fallback-proving' || this.phase === 'reconnect-proving') {""",
                  """    if (this.currentSocketEpoch !== null && normalizedEpoch !== this.currentSocketEpoch) {\n      // #304/control lifecycle owns physical socket replacement. Never let ACK\n      // cadence from the retired socket count toward a media verdict.\n      this.rebaseline({\n        capturedSamples: captured,\n        serverAcceptedFrameSerial: acceptedSerial,\n        socketEpoch: normalizedEpoch,\n        ...packetCounters,\n      });\n      this.lastLocalPath = localPath;\n      if (this.phase === 'fallback-proving' || this.phase === 'reconnect-proving') {""",
              ),
              (
                  """    if (!eligible) {\n      this.rebaseline({\n        capturedSamples: captured,\n        serverAcceptedFrameSerial: acceptedSerial,\n        socketEpoch: normalizedEpoch,\n        ...packetCounters,\n      });\n      return { action: 'none', reason: 'ineligible', ...this.status() };\n    }\n\n    if (this.phase === 'degraded-latched') {""",
                  """    if (!eligible) {\n      this.rebaseline({\n        capturedSamples: captured,\n        serverAcceptedFrameSerial: acceptedSerial,\n        socketEpoch: normalizedEpoch,\n        ...packetCounters,\n      });\n      this.lastLocalPath = localPath;\n      return { action: 'none', reason: 'ineligible', ...this.status() };\n    }\n\n    const localPathChanged = this.lastLocalPath !== null && localPath !== this.lastLocalPath;\n    this.lastLocalPath = localPath;\n    if (localPathChanged) {\n      if (this.phase === 'fallback-proving' || this.phase === 'reconnect-proving') {\n        // Semantic recovery already owns this WT→WS transition. Fence packet\n        // attribution at the local path boundary without disturbing the proof\n        // phase or its already-spent action budget.\n        this.rebaselinePacketCoverage(packetCounters);\n        this.staleCount = 0;\n      } else {\n        // #287 or another transport owner can change the local path between two\n        // health observations. Cumulative counters across that interval describe\n        // two different transports, so they cannot be charged to the new path.\n        this.rebaseline({\n          capturedSamples: captured,\n          serverAcceptedFrameSerial: acceptedSerial,\n          socketEpoch: normalizedEpoch,\n          ...packetCounters,\n        });\n        return { action: 'none', reason: 'media-path-rebaseline', ...this.status() };\n      }\n    }\n\n    if (this.phase === 'degraded-latched') {""",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:180]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify focused rebuild
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^public/mic-media-path-recovery.js$' | wc -l)" -eq 0
          git diff -- public/mic-media-path-recovery.js
      - name: Commit patch and retire temporary workflow
        run: |
          rm .github/workflows/patch-media-recovery-path-transition.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/mic-media-path-recovery.js .github/workflows/patch-media-recovery-path-transition.yml
          git commit -m "fix(audio): fence packet coverage across local path changes"
          git push origin HEAD:agent/media-recovery-path-transition-fence
