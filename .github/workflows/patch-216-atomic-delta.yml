name: Apply atomic boot delta patch

on:
  push:
    branches:
      - agent/boot-delta-atomic-reapply

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/boot-delta-atomic-reapply
          fetch-depth: 0
      - name: Apply server and regression patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | python
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts test/robot-source-disconnect.test.ts
          git diff --cached --check
          git commit -m "fix(timing): keep boot authority across delta jitter"
          git push origin HEAD:agent/boot-delta-atomic-reapply
