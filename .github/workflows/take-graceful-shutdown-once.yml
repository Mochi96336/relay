name: One-shot Take graceful shutdown

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/take-graceful-shutdown-once.yml
      - scripts/one-shot-take-graceful-shutdown.py
      - scripts/one-shot-take-graceful-shutdown-fixtures.py
      - scripts/one-shot-take-graceful-shutdown-harness.py

permissions:
  contents: write

concurrency:
  group: relay-take-graceful-shutdown-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm

      - name: Apply exact Take shutdown patch
        run: |
          python3 scripts/one-shot-take-graceful-shutdown.py
          python3 scripts/one-shot-take-graceful-shutdown-fixtures.py
          python3 scripts/one-shot-take-graceful-shutdown-harness.py
          git add -N test/server-take-shutdown.test.ts

      - name: Verify focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/server.ts \
            src/take-controller.ts \
            src/take-quality.ts \
            src/take-session.ts \
            test/helpers/harness.ts \
            test/server-take-shutdown.test.ts \
            test/take-quality.test.ts \
            test/take-session.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Run focused Take shutdown contracts
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/server-take-shutdown.test.ts \
            test/take-controller-storage.test.ts \
            test/take-quality.test.ts \
            test/take-session.test.ts \
            test/take-storage.test.ts \
            test/wav-take-writer.test.ts \
            test/take-server.test.ts

      - name: Verify systemd unit
        run: systemd-analyze --user verify deploy/relay-server.service

      - name: Run real HTTP/3 loopback
        run: npm run test:webtransport-loopback

      - name: Run full suite with failure annotation
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/relay-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/relay-full-suite.log').read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(lines) if ('not ok' in line.lower() or 'assertionerror' in line.lower() or 'err_assertion' in line.lower())]
          if markers:
              start = max(0, min(markers) - 10)
              end = min(len(lines), max(markers) + 70)
          else:
              start = max(0, len(lines) - 180)
              end = len(lines)
          snippet = '\n'.join(lines[start:end])[-12000:]
          escaped = snippet.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Take graceful shutdown full-suite failure::{escaped}')
          PY
            exit "$status"
          fi

      - name: Commit tested product diff and remove gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/take-graceful-shutdown-once.yml \
            scripts/one-shot-take-graceful-shutdown.py \
            scripts/one-shot-take-graceful-shutdown-fixtures.py \
            scripts/one-shot-take-graceful-shutdown-harness.py
          git add -- \
            src/server.ts \
            src/take-controller.ts \
            src/take-quality.ts \
            src/take-session.ts \
            test/helpers/harness.ts \
            test/server-take-shutdown.test.ts \
            test/take-quality.test.ts \
            test/take-session.test.ts
          git diff --cached --check
          git commit -m 'fix: preserve active Take on controlled shutdown'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
