name: Apply PR 215 path-only timing patch

on:
  push:
    branches:
      - agent/robot-path-waiting-is-not-zero

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-path-waiting-is-not-zero
          fetch-depth: 0
      - name: Apply server and integration-test patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-215.py
          python /tmp/patch-215.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts test/robot-source-disconnect.test.ts
          git diff --cached --check
          git commit -m "fix(timing): apply boot path before player delta"
          git push origin HEAD:agent/robot-path-waiting-is-not-zero
