<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Relay Live visual fixture</title>
  <link rel="stylesheet" href="/public/style.css" />
  <link rel="stylesheet" href="/public/live-state.css" />
  <link rel="stylesheet" href="/public/adjust.css" />
  <link rel="stylesheet" href="/public/song-surface.css" />
  <link rel="stylesheet" href="/public/system-details.css" />
  <link rel="stylesheet" href="/public/live-ia.css" />
  <style>
    .fixture-player {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(to top, rgba(0,0,0,.72), transparent 34%),
        radial-gradient(circle at 35% 38%, #41464f, #1b1e24 42%, #0c0d10 78%);
      color: #d9d9dc;
      font: 600 12px/1.2 system-ui, sans-serif;
    }
    .fixture-player::before {
      content: "YouTube";
      position: absolute;
      left: 14px;
      top: 12px;
      opacity: .76;
    }
    .fixture-player::after {
      content: "▶    ━━━━━━━━━━━━━━━    4:12   ⛶";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      color: #efeff1;
      font-weight: 500;
    }
    .fixture-artwork {
      background: radial-gradient(circle at 38% 30%, #9e876c, #393138 44%, #15161a 78%);
    }
    .fixture-artwork svg { width: 100%; height: 100%; display: block; }
    .fixture-note { color: #777a82; font-size: 10px; }
    .fixture-hidden { display: none !important; }
  </style>
</head>
<body data-lifecycle="live" data-health="healthy" data-timing="aligned" data-self-mic="off" data-room-mic="live" data-playback-role="observer" data-listen="audible">
  <main class="live-shell">
    <header class="room-header">
      <div class="room-mark">Relay</div>
      <div class="room-header-actions">
        <details class="people-menu">
          <summary><strong>M&nbsp;&nbsp;J</strong></summary>
        </details>
        <details id="room-more" class="more-menu">
          <summary aria-label="選項"><span aria-hidden="true">•••</span></summary>
        </details>
      </div>
    </header>

    <section class="song-stage" data-playback-role="observer" data-song-editing="false">
      <div class="song-heading-row">
        <div class="section-label">歌曲</div>
        <div class="song-heading-actions">
          <span id="song-device-note" class="song-device-note" hidden></span>
          <button id="change-youtube" class="text-action" type="button" hidden>換歌</button>
        </div>
      </div>

      <div id="song-observer" class="song-observer">
        <div class="fixture-artwork" aria-hidden="true"></div>
        <div class="song-observer-meta">
          <strong id="room-song-state">林俊傑 JJ Lin－偉大的渺小</strong>
          <span class="song-observer-author">JJ Lin 林俊傑</span>
          <span id="room-song-timeline">1:42 / 5:11</span>
          <span class="song-observer-status" hidden>播放中</span>
        </div>
      </div>

      <div class="youtube-form" hidden>
        <input type="text" value="https://youtu.be/example" />
        <button type="button">載入</button>
      </div>
      <div class="youtube-player-shell" hidden><div class="fixture-player"></div></div>
      <div class="youtube-readout" hidden><strong>播放中</strong><span>1:42 / 5:11</span></div>
    </section>

    <section class="performance-stage">
      <div class="section-label">人聲</div>
      <div class="voice-copy">
        <strong id="live-state-title">Mellow Rabbit 57</strong>
        <span id="live-state-detail">正在唱</span>
      </div>

      <div class="voice-input-evidence">
        <div id="mic-input-meter" class="voice-input-meter voice-presence" aria-hidden="true"></div>
      </div>

      <div class="mic-actions">
        <button id="start-publisher" class="mic-primary" type="button">🎤 接手 Mic</button>
        <button id="release-mic" class="text-action" type="button" hidden>放開 Mic</button>
      </div>

      <div id="mic-takeover" class="takeover-row" hidden>
        <span id="mic-takeover-copy">要從 Mellow Rabbit 57 接手嗎？他的 Mic 會停止，歌曲會繼續。</span>
        <div class="inline-actions">
          <button id="confirm-takeover" type="button">接手</button>
          <button id="cancel-takeover" class="text-action" type="button">取消</button>
        </div>
      </div>

      <details id="mic-live-control" class="mic-live-control">
        <summary><span>Mic</span><output>+24 dB</output></summary>
      </details>

      <section class="take-strip" data-take-state="idle">
        <div class="take-actions">
          <button id="start-recording" class="record-action" type="button">開始錄音</button>
          <button id="stop-recording" class="record-action recording" type="button" hidden>停止</button>
        </div>
        <p id="recording-status" class="microcopy"></p>
        <div id="last-take" class="last-take"><button class="take-link text-action" type="button">上一段錄音</button></div>
      </section>
    </section>

    <footer class="live-actions">
      <section class="local-listen local-sound-control">
        <div class="adjust-group-heading">
          <span class="section-label">房間聲音</span>
          <span>只影響這支裝置</span>
          <button id="listen-toggle" class="text-action" type="button">靜音</button>
        </div>
        <label class="adjust-control">
          <div class="adjust-row-heading"><strong>音量</strong><output id="listen-gain-value">30%</output></div>
          <input class="adjust-range" type="range" value="30" />
        </label>
        <p id="listen-adjust-state" class="adjust-helper"></p>
      </section>
    </footer>

    <details id="system-panel" class="system-panel">
      <summary>系統</summary>
      <div class="system-sheet">
        <div class="system-panel-heading"><strong>系統</strong><button class="text-action panel-done" type="button">完成</button></div>
        <p class="fixture-note">一切正常</p>
        <details id="diagnostics-panel" class="diagnostics-panel"><summary>Technical details</summary></details>
      </div>
    </details>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const state = params.get('state') || 'listener';
  const body = document.body;
  const stage = document.querySelector('.song-stage');
  const observer = document.querySelector('#song-observer');
  const player = document.querySelector('.youtube-player-shell');
  const change = document.querySelector('#change-youtube');
  const title = document.querySelector('#live-state-title');
  const detail = document.querySelector('#live-state-detail');
  const take = document.querySelector('.take-strip');
  const start = document.querySelector('#start-recording');
  const stop = document.querySelector('#stop-recording');
  const recordingStatus = document.querySelector('#recording-status');
  const publisher = document.querySelector('#start-publisher');
  const release = document.querySelector('#release-mic');
  const takeover = document.querySelector('#mic-takeover');
  const micControl = document.querySelector('#mic-live-control');
  const system = document.querySelector('#system-panel');

  const levels = [
    [0.15,.32,.72,.55,.18], [.1,.38,.88,.62,.22], [.14,.5,.94,.75,.28],
    [.1,.44,.8,.72,.33], [.18,.6,1,.66,.24], [.12,.48,.82,.58,.18],
    [.2,.66,.96,.54,.15], [.12,.54,.78,.46,.11], [.16,.7,.9,.48,.12], [.1,.42,.62,.36,.08]
  ];
  const meter = document.querySelector('#mic-input-meter');
  levels.forEach((sliceLevels, i) => {
    const slice = document.createElement('span');
    slice.className = 'voice-presence-slice';
    slice.style.opacity = String(.34 + i / 9 * .66);
    sliceLevels.forEach(level => {
      const band = document.createElement('span');
      band.className = 'voice-presence-band';
      band.style.opacity = String(.04 + level * .88);
      band.style.transform = `scaleX(${.4 + level * .6})`;
      slice.append(band);
    });
    meter.append(slice);
  });

  function singer() {
    body.dataset.selfMic = 'live';
    body.dataset.roomMic = 'live';
    body.dataset.listen = 'mic-muted';
    body.dataset.playbackRole = 'holder';
    stage.dataset.playbackRole = 'holder';
    observer.hidden = true;
    player.hidden = false;
    change.hidden = false;
    title.textContent = '你正在唱';
    detail.textContent = '';
    publisher.hidden = true;
    release.hidden = false;
    micControl.open = false;
    document.querySelector('#listen-toggle').textContent = '暫停中';
    document.querySelector('#listen-adjust-state').textContent = '唱歌時暫停';
  }

  if (state === 'empty') {
    body.dataset.roomMic = 'off';
    body.dataset.listen = 'ready';
    body.dataset.playbackRole = 'empty';
    stage.dataset.playbackRole = 'empty';
    observer.hidden = true;
    title.textContent = 'Mic 空著';
    detail.textContent = '';
    document.querySelector('.voice-input-evidence').style.display = 'none';
    start.disabled = true;
    recordingStatus.textContent = '開始唱歌或播放後可以錄音';
  } else if (state === 'singer') {
    singer();
  } else if (state === 'takeover') {
    publisher.hidden = true;
    takeover.hidden = false;
  } else if (state === 'recording') {
    singer();
    take.dataset.takeState = 'recording';
    start.hidden = true;
    stop.hidden = false;
    recordingStatus.textContent = '● 0:18';
  } else if (state === 'system') {
    system.open = true;
  }
</script>
</body>
</html>
