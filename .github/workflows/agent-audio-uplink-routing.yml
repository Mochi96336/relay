name: Agent audio uplink routing construction

on:
  push:
    branches:
      - agent/server-audio-uplink-routing

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Move only audio uplink routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/server.ts')
          text = path.read_text()
          if text.count("payload.type === 'audio-uplink-health'") != 1:
              raise SystemExit('expected exactly one inline audio-uplink-health branch')
          if 'audioUplinkHealth: (socket, payload) => {' in text:
              raise SystemExit('audio uplink protocol handler already exists')
          start = text.index("  setMix: (socket, payload) => {")
          close_marker = "\n  },\n\n});"
          insert_at = text.index(close_marker, start) + len("\n  },")
          handler = "\n  audioUplinkHealth: (socket, payload) => {\n    const health = parseAudioUplinkHealth(payload);\n    if (health) micRuntime.noteUplinkHealth(socket, health, performance.now());\n    return;\n  },"
          text = text[:insert_at] + handler + text[insert_at:]
          inline = "    if (payload.type === 'audio-uplink-health') {\n      const health = parseAudioUplinkHealth(payload);\n      if (health) micRuntime.noteUplinkHealth(socket, health, performance.now());\n      return;\n    }\n\n"
          if text.count(inline) != 1:
              raise SystemExit('inline audio uplink block did not match exactly once')
          path.write_text(text.replace(inline, '', 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Focused routing and uplink tests
        run: >-
          node --import tsx --test --test-concurrency=1
          test/relay-command-protocol.test.ts
          test/server-command-protocol-routing.test.ts
          test/audio-uplink-health.test.ts
          test/audio-uplink-health-server.test.ts
          test/audio-uplink-health-webtransport.test.ts
      - name: Verify diff
        run: git diff --check
      - name: Commit validated server move
        shell: bash
        run: |
          rm .github/workflows/agent-audio-uplink-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/agent-audio-uplink-routing.yml
          git commit -m 'refactor(server): route audio uplink health through protocol'
          git push origin HEAD:agent/server-audio-uplink-routing
