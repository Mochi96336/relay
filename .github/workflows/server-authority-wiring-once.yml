name: One-shot server authority wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/server-authority-wiring-once.py
      - .github/workflows/server-authority-wiring-once.yml

permissions:
  contents: write

concurrency:
  group: relay-server-authority-wiring-once
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Apply exact Mic authority/status replacements
        run: python3 .github/server-authority-wiring-once.py
      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          test "$(git status --short -- src/server.ts | wc -l)" -eq 1
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff -- src/server.ts
      - run: npm ci
      - run: npm run check
      - name: Run full tests before writing branch
        run: npm test
      - name: Commit only validated authority wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'refactor: wire canonical server authority effects'
          git pull --rebase origin agent/stabilize-room-kernel
          git push origin HEAD:agent/stabilize-room-kernel
