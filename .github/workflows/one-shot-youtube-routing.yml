name: One-shot YouTube telemetry routing patch

on:
  push:
    branches:
      - agent/server-youtube-telemetry-routing
    paths:
      - .github/workflows/one-shot-youtube-routing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/server-youtube-telemetry-routing
          fetch-depth: 1

      - name: Move the existing handler mechanically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          source = path.read_text()

          inline_start = "    if (payload.type === 'youtube-telemetry') {\n"
          next_route = "\n    if (payload.type === 'start-timing-calibration') {"
          command_start_marker = "const commandProtocol = createRelayCommandProtocol<RelaySocket>({\n"
          command_end_marker = "\n});\n\nlet shuttingDown = false;"

          assert source.count(inline_start) == 1, 'expected exactly one inline youtube-telemetry route'
          start = source.index(inline_start)
          end = source.index(next_route, start)
          block = source[start:end]
          assert block.endswith("      return;\n    }\n"), 'unexpected youtube-telemetry block ending'

          body = block[len(inline_start):-len("    }\n")]
          body_lines = []
          for line in body.splitlines(keepends=True):
              if line.strip():
                  assert line.startswith('  '), f'unexpected indentation: {line!r}'
                  body_lines.append(line[2:])
              else:
                  body_lines.append(line)
          callback = "  youtubeTelemetry: (socket, payload) => {\n" + ''.join(body_lines) + "  },\n"

          source = source[:start] + source[end:]
          command_start = source.index(command_start_marker)
          command_end = source.index(command_end_marker, command_start)
          source = source[:command_end] + "\n" + callback + source[command_end:]

          assert "payload.type === 'youtube-telemetry'" not in source
          assert source.count('youtubeTelemetry: (socket, payload) => {') == 1
          assert "roomSongCommands.gateTelemetry(" in callback
          assert "youtubeTimeline.update(" in callback
          assert "playbackTransport.register(socket, acceptedIdentity);" in callback
          assert "roomSongCommands.complete(commandGate.completesCommandId)" in callback
          assert "type: 'song-handoff-complete'" in callback

          path.write_text(source)
          PY

      - name: Verify diff is only the routing relocation
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          diff = subprocess.check_output(['git', 'diff', '--', 'src/server.ts'], text=True)
          removed_comments = [line for line in diff.splitlines() if line.startswith('-  //') or line.startswith('-/**') or line.startswith('- *')]
          assert not removed_comments, 'mechanical move unexpectedly removed unrelated documentation comments'
          assert "-    if (payload.type === 'youtube-telemetry') {" in diff
          assert "+  youtubeTelemetry: (socket, payload) => {" in diff
          PY

      - name: Commit patch and retire one-shot workflow
        shell: bash
        run: |
          git config user.name "relay-cleanup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-youtube-routing.yml
          git add src/server.ts
          git commit -m "refactor(server): delegate YouTube telemetry routing"
          git push origin HEAD:agent/server-youtube-telemetry-routing
