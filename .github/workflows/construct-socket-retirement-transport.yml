name: Construct socket retirement transport

on:
  push:
    branches:
      - agent/socket-retirement-transport

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded server patch
        run: node scripts/construct-socket-retirement-transport.mjs
      - name: Typecheck
        run: npm run check
      - name: Prove socket retirement transport
        run: node --import tsx --test test/relay-socket-server.test.ts
      - name: Preserve activation composition contracts
        run: node --import tsx --test test/server-publisher-activation-coordinator.test.ts test/server-backing-activation-coordinator.test.ts
      - name: Verify diff and commit clean output
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Mochi96336@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(socket): centralize replaced transport retirement"
          git push
