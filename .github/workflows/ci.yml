name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm
      - run: npm ci
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Run npm test
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e

          if (( status != 0 )); then
            mkdir -p ci-summary

            tail -n 120 test-output.log \
              | sed -E $'s/\x1B\\[[0-9;?]*[ -\\/]*[@-~]//g' \
              | head -c 12288 \
              > ci-summary/npm-test-excerpt.txt

            {
              echo 'Relay CI Failure Summary'
              echo '========================'
              echo
              echo "workflow=CI"
              echo "job=test"
              echo "step=npm test"
              echo "sha=${GITHUB_SHA}"
              echo "exit_code=${status}"
              echo
              echo 'FAILURE EXCERPT (last 120 lines, bounded)'
              echo '-----------------------------------------'
              cat ci-summary/npm-test-excerpt.txt
            } > ci-summary/npm-test-failure.txt

            {
              echo '## ❌ npm test failed'
              echo
              echo "- **Job:** \`test\`"
              echo "- **Step:** \`npm test\`"
              echo "- **Exit code:** \`${status}\`"
              echo "- **Commit:** \`${GITHUB_SHA}\`"
              echo
              echo '### Failure excerpt'
              echo
              echo '```text'
              cat ci-summary/npm-test-excerpt.txt
              echo
              echo '```'
              echo
              echo '_Excerpt is limited to the final 120 lines and 12 KiB; the full output remains in the Actions log._'
            } >> "$GITHUB_STEP_SUMMARY"

            echo '::error title=npm test failed::See the job summary and ci-failure-test artifact for bounded failure evidence.'
          fi

          exit "$status"
      - name: Upload npm test failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-test
          path: ci-summary/npm-test-failure.txt
          if-no-files-found: ignore
          retention-days: 7

  visual-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - run: npm ci
      - name: Install screenshot browser
        run: npx -y playwright@1.55.0 install chromium
      - name: Install production DOM interaction runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Serve deterministic Live fixtures from Relay static root
        run: |
          cp test/fixtures/live-visual.html public/__live-visual.html
          cp test/fixtures/live-visual-ribbon.js public/__live-visual-ribbon.js
          sed -i 's#</body>#<script src="/__live-visual-ribbon.js"></script></body>#' public/__live-visual.html
          cp test/fixtures/live-p0-layout.html public/__live-p0-layout.html
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/relay-visual-http.log 2>&1 &
          echo $! > /tmp/relay-visual-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/__live-visual.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/__live-p0-layout.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/relay-visual-http.log
          exit 1
      - name: Run production DOM interaction tests
        env:
          RELAY_INTERACTION_URL: http://127.0.0.1:4173/
        run: npx playwright test test/browser/live-interaction.spec.mjs --workers=1 --reporter=line
      - name: Capture phone states and assert browser geometry
        run: |
          mkdir -p screenshots
          for state in empty listener singer takeover recording system; do
            npx -y playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size="390,844" \
              --full-page \
              --wait-for-timeout=250 \
              "http://127.0.0.1:4173/__live-visual.html?state=${state}" \
              "screenshots/${state}.png"
          done

          for state in take-history-one take-history-many room-sound-normal room-sound-muted room-sound-forced room-sound-retry; do
            npx -y playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size="390,844" \
              --wait-for-timeout=700 \
              "http://127.0.0.1:4173/__live-p0-layout.html?state=${state}" \
              "screenshots/${state}.png"
          done

          for width in 759 760 768; do
            npx -y playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size="${width},844" \
              --wait-for-timeout=700 \
              "http://127.0.0.1:4173/__live-p0-layout.html?state=take-history-one" \
              "/tmp/take-history-${width}.png"
          done

          npx -y playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="1024,768" \
            --wait-for-timeout=700 \
            "http://127.0.0.1:4173/__live-p0-layout.html?state=take-history-one" \
            "/tmp/take-history-desktop.png"

          sleep 0.25
          if grep -q '/__geometry-fail' /tmp/relay-visual-http.log; then
            echo 'Chromium layout geometry failed:'
            grep '/__geometry-' /tmp/relay-visual-http.log || true
            exit 1
          fi

          for marker in \
            'state=take-history-one&vw=390' \
            'state=take-history-many&vw=390' \
            'state=room-sound-normal&vw=390' \
            'state=room-sound-muted&vw=390' \
            'state=room-sound-forced&vw=390' \
            'state=room-sound-retry&vw=390' \
            'state=take-history-one&vw=759' \
            'state=take-history-one&vw=760' \
            'state=take-history-one&vw=768' \
            'state=take-history-one&vw=1024'; do
            if ! grep -q "/__geometry-pass?${marker}" /tmp/relay-visual-http.log; then
              echo "Missing Chromium geometry pass marker: ${marker}"
              grep '/__geometry-' /tmp/relay-visual-http.log || true
              exit 1
            fi
          done
      - name: Upload Live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-phone-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

  webtransport-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Real HTTP/3 + 1200-byte WebTransport datagram loopback
        run: npm run test:webtransport-loopback
