name: Integrate AudioPacket with runtime product stack

on:
  push:
    branches:
      - agent/audio-packet-v2
    paths:
      - .github/workflows/audio-packet-integration-probe.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/audio-packet-v2
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'

      - name: Merge runtime stack and resolve pinned seams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'relay-audio-integration[bot]'
          git config user.email 'relay-audio-integration[bot]@users.noreply.github.com'
          git fetch origin agent/runtime-product-status

          set +e
          git merge --no-commit --no-ff origin/agent/runtime-product-status
          merge_status=$?
          set -e
          if [[ "$merge_status" -eq 0 ]]; then
            echo 'Expected the known integration seams, but merge completed without conflicts.' >&2
            exit 1
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Conflicts: %s\n' "${conflicts[*]}"
          if [[ "${#conflicts[@]}" -ne 2 \
             || " ${conflicts[*]} " != *' src/audio-session.ts '* \
             || " ${conflicts[*]} " != *' src/server.ts '* ]]; then
            echo 'Conflict set changed; refusing automatic resolution.' >&2
            exit 1
          fi

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function resolveAudioSession() {
            const path = 'src/audio-session.ts';
            let source = readFileSync(path, 'utf8');
            const conflict = /<<<<<<< HEAD\n([\s\S]*?)=======\n([\s\S]*?)>>>>>>> origin\/agent\/runtime-product-status\n/g;
            let count = 0;
            source = source.replace(conflict, (whole, ours, theirs) => {
              count += 1;
              if (!ours.includes('if (samples.length === 0) return { samples, start };')
                  || !ours.includes('timeline.chunks.push({ start, samples });')
                  || !theirs.includes('timeline.chunks.push({ start, samples, positioned });')) {
                throw new Error('audio-session conflict shape changed');
              }
              return [
                '    if (samples.length === 0) return { samples, start };',
                '    timeline.chunks.push({ start, samples, positioned });',
                '',
              ].join('\n');
            });
            if (count !== 1 || source.includes('<<<<<<<') || source.includes('>>>>>>>')) {
              throw new Error(`audio-session expected one resolved conflict, saw ${count}`);
            }
            writeFileSync(path, source);
          }

          function resolveServer() {
            const path = 'src/server.ts';
            let source = readFileSync(path, 'utf8');
            const conflict = /<<<<<<< HEAD\n([\s\S]*?)=======\n([\s\S]*?)>>>>>>> origin\/agent\/runtime-product-status\n/g;
            let count = 0;
            source = source.replace(conflict, (whole, ours, theirs) => {
              count += 1;

              if (ours.includes("decodePcmFrame, type PcmFrame")
                  && theirs.includes('authorizeMicOwnerCommand')) {
                return [
                  "import { authorizeMicOwnerCommand, type MicOwnerCommand } from './command-authority.js';",
                  "import { decodePcmFrame, type PcmFrame } from './pcm-frame.js';",
                  "import { buildProductViewModel } from './product-view-model.js';",
                  "import { buildReadiness } from './readiness.js';",
                  '',
                ].join('\n');
              }

              if (ours.includes('MIC_REORDER_WINDOW_PACKETS')
                  && theirs.includes('PLAYBACK_MIC_INTENT_MS')) {
                return `${ours}${theirs}`;
              }

              if (ours.includes('micPacketReceiver = null;')
                  && theirs.includes("takeController.noteQualityEvent('mic-owner-changed')")) {
                return `${ours}${theirs}`;
              }

              if (ours.includes("socket.audioPacketVersion === 2")
                  && theirs.includes('testActive || session.active')) {
                // AudioPacket owns physical ingress here. The full runtime-side
                // Mic semantics are preserved in processPublisherFrame below.
                return ours;
              }

              throw new Error(`unrecognized server conflict:\nOURS:\n${ours}\nTHEIRS:\n${theirs}`);
            });

            if (count !== 5 || source.includes('<<<<<<<') || source.includes('>>>>>>>')) {
              throw new Error(`server expected five resolved conflicts, saw ${count}`);
            }

            const restartBefore = [
              '      if (micRestarted) {',
              '        abandonProbeRun();',
            ].join('\n');
            const restartAfter = [
              '      if (micRestarted) {',
              "        takeController.noteQualityEvent('mic-capture-restarted');",
              '        abandonProbeRun();',
            ].join('\n');
            if ((source.split(restartBefore).length - 1) !== 1) {
              throw new Error('processPublisherFrame restart seam changed');
            }
            source = source.replace(restartBefore, restartAfter);

            const publicationBefore = [
              '          syncAppliedCalibration();',
              '          broadcastJson(sourceStatusPayload());',
              '          broadcastJson(timingCalibrationStatusPayload());',
            ].join('\n');
            const publicationAfter = [
              '          syncAppliedCalibration();',
              '          // Publish invalidated timing before the source summary',
              '          // so consumers never observe stale timing for a new capture.',
              '          broadcastJson(timingCalibrationStatusPayload());',
              '          broadcastJson(sourceStatusPayload());',
            ].join('\n');
            if ((source.split(publicationBefore).length - 1) !== 1) {
              throw new Error('processPublisherFrame publication seam changed');
            }
            source = source.replace(publicationBefore, publicationAfter);

            writeFileSync(path, source);
          }

          resolveAudioSession();
          resolveServer();
          NODE

          git add src/audio-session.ts src/server.ts
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          rm .github/workflows/audio-packet-integration-probe.yml
          git add -A

          npm ci
          npm run check
          find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n scripts/*.sh
          npm test

          git commit -m 'integrate AudioPacket v2 with runtime product stack'
          git push origin HEAD:agent/audio-packet-v2
