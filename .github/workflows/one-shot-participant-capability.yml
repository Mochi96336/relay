name: one-shot participant capability fix

on:
  push:
    branches:
      - agent/stabilize-room-kernel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: python3 scripts/one-shot-participant-capability.py
      - run: npm ci
      - run: npm run check

      - name: Run full tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/relay-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/relay-test.log').read_text(errors='replace').splitlines()
          selected = []
          hits = [
              index for index, line in enumerate(lines)
              if re.match(r'^\s*not ok\b', line)
              or re.search(r'failureType:|AssertionError|ERR_ASSERTION|ERR_TEST_FAILURE', line)
          ]
          for index in hits:
              selected.extend(lines[max(0, index - 8):min(len(lines), index + 28)])
          selected.extend(['', '--- final summary ---', *lines[-35:]])
          text = '\n'.join(selected[-220:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Relay full test failure::{text}')
          PY
          fi
          exit "$status"

      - name: Commit validated fix
        shell: bash
        run: |
          rm scripts/one-shot-participant-capability.py
          rm .github/workflows/one-shot-participant-capability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+Mochi96336@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: bind participant authority to a private capability"
          git pull --rebase origin agent/stabilize-room-kernel
          git push origin HEAD:agent/stabilize-room-kernel
