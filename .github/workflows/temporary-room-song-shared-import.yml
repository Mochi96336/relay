name: Temporary Room Song shared import patch

on:
  push:
    branches:
      - agent/shared-room-song-convergence

permissions:
  contents: write

jobs:
  exact-import-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/shared-room-song-convergence
          fetch-depth: 1
      - name: Replace exactly one server import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/room-song-command-session.ts')
          old = "../public/room-song-command-convergence.js"
          new = "../shared/room-song-command-convergence.js"
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old convergence import, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/room-song-command-session.ts"
          git diff -- src/room-song-command-session.ts
      - name: Commit exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/room-song-command-session.ts
          git commit -m 'refactor(room-song): consume convergence from shared layer'
          git push origin HEAD:agent/shared-room-song-convergence
