name: Release integration probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/release-executor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Reconcile feeders and verify
        shell: bash
        run: bash .github/release-integrate.sh
