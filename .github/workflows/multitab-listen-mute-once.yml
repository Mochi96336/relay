name: One-shot multi-tab Listen mute fix

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/multitab-listen-mute-once.yml
      - scripts/one-shot-multitab-listen-mute.py

permissions:
  contents: write

concurrency:
  group: relay-multitab-listen-mute-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact multi-tab Listen patch
        run: python3 scripts/one-shot-multitab-listen-mute.py

      - name: Verify focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            public/listen.js \
            public/presence.js \
            test/mic-lifecycle-recovery.test.ts \
            test/playback-listen-guard.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Check browser JavaScript syntax
        run: |
          node --check public/listen.js
          node --check public/presence.js

      - name: Run focused Listen/Mic lifecycle contracts
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/mic-lifecycle-recovery.test.ts \
            test/playback-listen-guard.test.ts

      - name: Run full suite with failure annotation
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/relay-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/relay-full-suite.log').read_text(errors='replace').splitlines()
          markers = [
              i for i, line in enumerate(lines)
              if ('not ok' in line.lower()
                  or 'assertionerror' in line.lower()
                  or 'err_assertion' in line.lower()
                  or 'test failed' in line.lower())
          ]
          if markers:
              start = max(0, min(markers) - 8)
              end = min(len(lines), max(markers) + 45)
          else:
              start = max(0, len(lines) - 120)
              end = len(lines)
          snippet = '\n'.join(lines[start:end])[-12000:]
          escaped = (snippet
              .replace('%', '%25')
              .replace('\r', '%0D')
              .replace('\n', '%0A'))
          print(f'::error title=Relay full suite failure::{escaped}')
          PY
            exit "$status"
          fi

      - name: Commit tested product diff and remove gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/multitab-listen-mute-once.yml \
            scripts/one-shot-multitab-listen-mute.py
          git add -- \
            public/listen.js \
            public/presence.js \
            test/mic-lifecycle-recovery.test.ts \
            test/playback-listen-guard.test.ts
          git diff --cached --check
          git commit -m 'fix: mute Listen across participant tabs'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
