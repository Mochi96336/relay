name: One-shot authority release and status wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/authority-release-status-once.yml

permissions:
  contents: write

concurrency:
  group: relay-authority-release-status-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact authority wiring
        run: python3 .github/authority-release-status.py

      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/server.ts test/runtime-single-snapshot.test.ts

      - run: npm ci
      - run: npm run check
      - name: Run full suite before writing branch
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          set +e
          npm test > /tmp/authority-full-suite.log 2>&1
          status=$?
          set -e
          tail -n 300 /tmp/authority-full-suite.log
          if [ "$status" -ne 0 ]; then
            tail -n 300 /tmp/authority-full-suite.log > .github/authority-failure.log
            git fetch origin "$BRANCH"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || {
              echo 'Branch moved while capturing diagnostics; refusing to overwrite newer work.' >&2
              exit "$status"
            }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .github/authority-failure.log
            git commit -m 'chore: capture authority wiring failure'
            git push origin HEAD:"$BRANCH"
            exit "$status"
          fi

      - name: Commit verified wiring and remove one-shot tooling
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" || {
            echo 'Branch moved while the gate was running; refusing to overwrite newer work.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/authority-release-status.py .github/workflows/authority-release-status-once.yml .github/authority-failure.log
          git add -A -- src/server.ts test/runtime-single-snapshot.test.ts .github
          git commit -m 'refactor: wire mic release effects and remote status'
          git push origin HEAD:"$BRANCH"
