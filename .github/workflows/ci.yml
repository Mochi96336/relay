name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm
      - run: npm ci
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Run npm test
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            message="$(tail -n 120 test-output.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=npm test failed::$message"
          fi
          exit "$status"

  visual-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - run: npm ci
      - name: Install screenshot browser
        # Runner images already carry Chromium's system libraries. Avoid
        # --with-deps here: it invokes apt and can spend the entire job timeout
        # waiting on an Ubuntu mirror even though Relay itself is healthy.
        run: npx -y playwright@1.55.0 install chromium
      - name: Serve deterministic Live fixtures from Relay static root
        run: |
          cp test/fixtures/live-visual.html public/__live-visual.html
          cp test/fixtures/live-visual-ribbon.js public/__live-visual-ribbon.js
          sed -i 's#</body>#<script src="/__live-visual-ribbon.js"></script></body>#' public/__live-visual.html
          cp test/fixtures/live-p0-layout.html public/__live-p0-layout.html
          # CI-only diagnostics. If the geometry gate fails, report both ordinary
          # boxes and root/pseudo geometry so invisible scrollable overflow has a
          # concrete source instead of being papered over with overflow-x:hidden.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/__live-p0-layout.html')
          text = path.read_text()
          probe = '''<script>setTimeout(()=>{const state=document.body.dataset.fixtureState||'unknown';const vw=innerWidth;const round=n=>Math.round(n*10)/10;const offenders=[...document.querySelectorAll('body *')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,cls:typeof e.className==='string'?e.className:'',left:round(r.left),right:round(r.right),width:round(r.width)}}).filter(x=>x.right>vw+.5||x.left<-.5).slice(0,12);fetch('/__geometry-overflow?state='+encodeURIComponent(state)+'&vw='+vw+'&detail='+encodeURIComponent(JSON.stringify(offenders))).catch(()=>{});const style=(e,pseudo)=>{const s=getComputedStyle(e,pseudo);return {content:s.content,display:s.display,position:s.position,width:s.width,minWidth:s.minWidth,maxWidth:s.maxWidth,marginLeft:s.marginLeft,marginRight:s.marginRight,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,borderLeft:s.borderLeftWidth,borderRight:s.borderRightWidth,left:s.left,right:s.right,overflowX:s.overflowX,transform:s.transform,outlineWidth:s.outlineWidth,outlineOffset:s.outlineOffset}};const snap=e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,clientWidth:e.clientWidth,offsetWidth:e.offsetWidth,scrollWidth:e.scrollWidth,rect:{left:round(r.left),right:round(r.right),width:round(r.width)},style:style(e),before:style(e,'::before'),after:style(e,'::after')}};const detail={innerWidth,outerWidth,visualViewport:visualViewport?.width,devicePixelRatio,scrollingElement:document.scrollingElement?.tagName,html:snap(document.documentElement),body:snap(document.body),shell:snap(document.querySelector('.live-shell'))};fetch('/__geometry-root?state='+encodeURIComponent(state)+'&vw='+vw+'&detail='+encodeURIComponent(JSON.stringify(detail))).catch(()=>{})},180)</script>'''
          path.write_text(text.replace('</body>', probe + '</body>'))
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/relay-visual-http.log 2>&1 &
          echo $! > /tmp/relay-visual-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/__live-visual.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/__live-p0-layout.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/relay-visual-http.log
          exit 1
      - name: Capture phone states and assert browser geometry
        run: |
          mkdir -p screenshots
          for state in empty listener singer takeover recording system; do
            npx -y playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size="390,844" \
              --full-page \
              --wait-for-timeout=250 \
              "http://127.0.0.1:4173/__live-visual.html?state=${state}" \
              "screenshots/${state}.png"
          done

          # These states run the production Take History / Room sound presenters.
          # Keep the artifact itself at the exact phone viewport; the page reports
          # its post-layout Chromium geometry back through the fixture HTTP log.
          for state in take-history-one take-history-many room-sound-normal room-sound-muted room-sound-forced; do
            npx -y playwright@1.55.0 screenshot \
              --browser chromium \
              --viewport-size="390,844" \
              --wait-for-timeout=400 \
              "http://127.0.0.1:4173/__live-p0-layout.html?state=${state}" \
              "screenshots/${state}.png"
          done

          # Desktop regression probe: Take must remain centered by the existing
          # overlay instead of inheriting the mobile bottom-sheet pinning.
          npx -y playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size="1024,768" \
            --wait-for-timeout=400 \
            "http://127.0.0.1:4173/__live-p0-layout.html?state=take-history-one" \
            "/tmp/take-history-desktop.png"

          sleep 0.25
          if grep -q '/__geometry-fail' /tmp/relay-visual-http.log; then
            echo 'Chromium layout geometry failed:'
            grep '/__geometry-' /tmp/relay-visual-http.log || true
            exit 1
          fi

          for marker in \
            'state=take-history-one&vw=390' \
            'state=take-history-many&vw=390' \
            'state=room-sound-normal&vw=390' \
            'state=room-sound-muted&vw=390' \
            'state=room-sound-forced&vw=390' \
            'state=take-history-one&vw=1024'; do
            if ! grep -q "/__geometry-pass?${marker}" /tmp/relay-visual-http.log; then
              echo "Missing Chromium geometry pass marker: ${marker}"
              grep '/__geometry-' /tmp/relay-visual-http.log || true
              exit 1
            fi
          done
      - name: Upload Live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-phone-screenshots
          path: screenshots/*.png
          # Capture/installation failures already fail their own step. Do not
          # turn a missing artifact into a second, misleading root-cause error.
          if-no-files-found: warn
          retention-days: 7

  webtransport-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Real HTTP/3 + 1200-byte WebTransport datagram loopback
        run: npm run test:webtransport-loopback
