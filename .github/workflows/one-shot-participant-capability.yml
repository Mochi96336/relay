name: one-shot participant capability fix

on:
  push:
    branches:
      - agent/stabilize-room-kernel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Adapt capability patch to client indentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/one-shot-participant-capability.py')
          text = path.read_text()
          old = '''shared_old = """    const nickname = typeof window.relayNickname === 'string'
                ? window.relayNickname.trim()
                : '';
              if (participantId && nickname) {
                params.set('participant', participantId);
                params.set('name', nickname);
              }
          """
          shared_new = """    const nickname = typeof window.relayNickname === 'string'
                ? window.relayNickname.trim()
                : '';
              const participantCapability = typeof window.relayParticipantCapability === 'string'
                ? window.relayParticipantCapability.trim()
                : '';
              if (participantId && nickname && participantCapability) {
                params.set('participant', participantId);
                params.set('cap', participantCapability);
                params.set('name', nickname);
              }
          """
          for path in [
              'public/app.js',
              'public/listen.js',
              'public/live-status.js',
              'public/system-details.js',
              'public/youtube-sync.js',
          ]:
              replace_once(path, shared_old, shared_new)
          '''
          new = '''def replace_client_identity_query(path: str):
              target = Path(path)
              text = target.read_text()
              matches = []
              for indent in ('  ', '    '):
                  old = (
                      f"{indent}const nickname = typeof window.relayNickname === 'string'\\n"
                      f"{indent}  ? window.relayNickname.trim()\\n"
                      f"{indent}  : '';\\n"
                      f"{indent}if (participantId && nickname) {{\\n"
                      f"{indent}  params.set('participant', participantId);\\n"
                      f"{indent}  params.set('name', nickname);\\n"
                      f"{indent}}}\\n"
                  )
                  if old in text:
                      matches.append((indent, old))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected one participant identity query block, found {len(matches)}')
              indent, old = matches[0]
              replacement = (
                  f"{indent}const nickname = typeof window.relayNickname === 'string'\\n"
                  f"{indent}  ? window.relayNickname.trim()\\n"
                  f"{indent}  : '';\\n"
                  f"{indent}const participantCapability = typeof window.relayParticipantCapability === 'string'\\n"
                  f"{indent}  ? window.relayParticipantCapability.trim()\\n"
                  f"{indent}  : '';\\n"
                  f"{indent}if (participantId && nickname && participantCapability) {{\\n"
                  f"{indent}  params.set('participant', participantId);\\n"
                  f"{indent}  params.set('cap', participantCapability);\\n"
                  f"{indent}  params.set('name', nickname);\\n"
                  f"{indent}}}\\n"
              )
              target.write_text(text.replace(old, replacement, 1))

          for path in [
              'public/app.js',
              'public/listen.js',
              'public/live-status.js',
              'public/system-details.js',
              'public/youtube-sync.js',
          ]:
              replace_client_identity_query(path)
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'capability patch adapter: expected one shared block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - run: python3 scripts/one-shot-participant-capability.py
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Commit validated fix
        shell: bash
        run: |
          rm scripts/one-shot-participant-capability.py
          rm .github/workflows/one-shot-participant-capability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: bind participant authority to a private capability"
          git pull --rebase origin agent/stabilize-room-kernel
          git push origin HEAD:agent/stabilize-room-kernel
