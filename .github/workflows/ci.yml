name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm
      - run: npm ci
      - name: Check CI summary runner syntax
        run: bash -n scripts/ci-run.sh
      - name: Run npm check
        id: npm-check
        run: bash scripts/ci-run.sh test check "npm run check" -- npm run check
      - name: Upload npm check failure summary
        if: failure() && steps.npm-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-check
          path: ci-summary/check-failure.txt
          if-no-files-found: error
          retention-days: 7
      - name: Check browser JavaScript syntax
        id: browser-js
        run: bash scripts/ci-run.sh test browser-js "browser JavaScript syntax" -- bash -o pipefail -c "find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check"
      - name: Upload browser JavaScript failure summary
        if: failure() && steps.browser-js.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-browser-js
          path: ci-summary/browser-js-failure.txt
          if-no-files-found: error
          retention-days: 7
      - name: Check launcher shell syntax
        id: shell-syntax
        run: bash scripts/ci-run.sh test shell-syntax "launcher shell syntax" -- bash -c 'bash -n scripts/*.sh'
      - name: Upload launcher shell failure summary
        if: failure() && steps.shell-syntax.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-shell-syntax
          path: ci-summary/shell-syntax-failure.txt
          if-no-files-found: error
          retention-days: 7
      - name: Run npm test
        id: npm-test
        run: bash scripts/ci-run.sh test test "npm test" -- npm test
      - name: Upload npm test failure summary
        if: failure() && steps.npm-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-test
          path: ci-summary/test-failure.txt
          if-no-files-found: error
          retention-days: 7

  visual-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - run: npm ci
      - name: Install screenshot CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Install screenshot browser
        run: npx -y playwright@1.55.0 install chromium
      - name: Install production DOM interaction runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Serve deterministic Live fixtures from Relay static root
        run: |
          cp test/fixtures/live-visual-bootstrap.js public/__live-visual-bootstrap.js
          node scripts/build-live-visual-fixture.mjs public/index.html public/__live-visual.html
          cp test/fixtures/live-p0-layout.html public/__live-p0-layout.html
          cp test/fixtures/room-sound-geometry.html public/__room-sound-geometry.html
          cp test/fixtures/listener-debug.html public/__listener-debug.html
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/relay-visual-http.log 2>&1 &
          echo $! > /tmp/relay-visual-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/__live-visual.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/__live-p0-layout.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/__room-sound-geometry.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:4173/__listener-debug.html > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/relay-visual-http.log
          exit 1
      - name: Run production DOM interaction tests
        id: browser-interaction
        env:
          RELAY_INTERACTION_URL: http://127.0.0.1:4173/
        run: bash scripts/ci-run.sh visual-screenshots browser-interaction "production DOM interaction tests" -- npx playwright test test/browser/live-interaction.spec.mjs test/browser/live-visual-proof.spec.mjs test/browser/room-sound-geometry.spec.mjs test/browser/listener-debug.spec.mjs test/browser/take-history-review.spec.mjs test/browser/take-history-long-list.spec.mjs --workers=1 --reporter=line
      - name: Upload browser interaction failure summary
        if: failure() && steps.browser-interaction.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-browser-interaction
          path: ci-summary/browser-interaction-failure.txt
          if-no-files-found: error
          retention-days: 7
      - name: Capture phone states and assert browser geometry
        id: browser-geometry
        run: bash scripts/ci-run.sh visual-screenshots browser-geometry "browser geometry" -- bash scripts/ci-visual-geometry.sh
      - name: Upload browser geometry failure summary
        if: failure() && steps.browser-geometry.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-browser-geometry
          path: ci-summary/browser-geometry-failure.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-phone-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

  webtransport-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Real HTTP/3 + 1200-byte WebTransport datagram loopback
        id: webtransport
        run: bash scripts/ci-run.sh webtransport-loopback webtransport "WebTransport loopback" -- npm run test:webtransport-loopback
      - name: Upload WebTransport failure summary
        if: failure() && steps.webtransport.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-webtransport
          path: ci-summary/webtransport-failure.txt
          if-no-files-found: error
          retention-days: 7
