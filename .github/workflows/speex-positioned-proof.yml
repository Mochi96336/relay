name: Speex positioned authority offline proof

on:
  pull_request:
    paths:
      - scripts/experiments/speex-positioned-fixtures.ts
      - scripts/experiments/speex-positioned-probe.c
      - scripts/experiments/check-speex-positioned.mjs
      - .github/workflows/speex-positioned-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positioned-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build external SpeexDSP candidate only in experimental job
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libspeexdsp-dev pkg-config
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            scripts/experiments/speex-positioned-probe.c \
            -o /tmp/speex-positioned \
            $(pkg-config --cflags --libs speexdsp) -lm
      - name: Generate exact PCM and actual AudioSession reference trace
        run: |
          mkdir -p positioned-evidence
          node --import tsx scripts/experiments/speex-positioned-fixtures.ts positioned-evidence \
            | tee positioned-evidence/control-console.json
      - name: Replay identical PCM at low, desktop, and high filter quality
        run: |
          for quality in 3 5 8; do
            /tmp/speex-positioned positioned-evidence/events.tsv positioned-evidence "$quality" \
              > "positioned-evidence/native-q${quality}.ndjson"
          done
      - name: Audit boundaries independently at all three filter qualities
        run: |
          for quality in 3 5 8; do
            node scripts/experiments/check-speex-positioned.mjs positioned-evidence \
              "native-q${quality}.ndjson" "comparison-q${quality}.json" \
              | tee "positioned-evidence/console-q${quality}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=[3,5,8].map(quality=>{
            const r=JSON.parse(fs.readFileSync('positioned-evidence/comparison-q'+quality+'.json','utf8'));
            const gap=r.scenarios.find(s=>s.scenario==='mic-gap-50ms');
            return {
              quality,
              trueGapSamples:gap.trueGapSamples,
              filterLatencySamples:gap.knownFilterLatencySamples,
              unfilledTargetEstimate:gap.nativeUnfilledTargetEstimate,
              baselineSteadyRms:r.phaseSteadyTone.baselineCubicRms,
              candidateSteadyRms:r.phaseSteadyTone.nativePostDelayRms,
            };
          });
          fs.writeFileSync('positioned-evidence/quality-tradeoff.json',JSON.stringify(rows,null,2)+'\n');
          console.log(JSON.stringify(rows,null,2));
          NODE
      - name: Archive independent evidence and explicit unresolved group latency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speex-positioned-authority-evidence
          path: |
            positioned-evidence/control-console.json
            positioned-evidence/events.tsv
            positioned-evidence/baseline.json
            positioned-evidence/native-q*.ndjson
            positioned-evidence/comparison-q*.json
            positioned-evidence/console-q*.json
            positioned-evidence/quality-tradeoff.json
            positioned-evidence/nativepcm/*.pcm
            positioned-evidence/baseline-*.pcm
            positioned-evidence/*-mic-gap*.wav
          if-no-files-found: warn
          retention-days: 14
