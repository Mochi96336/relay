name: One-shot participant auth message

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/participant-auth-message-once.yml

permissions:
  contents: write

concurrency:
  group: relay-participant-auth-message-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm

      - name: Apply participant auth message patch
        run: |
          python3 scripts/one-shot-participant-auth-message.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/take-client.test.ts')
          text = path.read_text()
          old = "  assert.match(source, /window\\.relayParticipantId/);\n"
          new = """  assert.match(source, /sendParticipantAuthentication/);
          assert.match(source, /participant-auth\\.js/);
          assert.doesNotMatch(source, /params\\.set\\('cap',/);
          """
          if text.count(old) != 1:
              raise SystemExit(f'{path}: expected exactly one stale participant-id contract')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused diff
        run: |
          git add -N public/participant-auth.js
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            public/app.js \
            public/listen.js \
            public/live-status.js \
            public/participant-auth.js \
            public/presence.js \
            public/recorder.js \
            public/system-details.js \
            public/youtube-sync.js \
            src/server.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/take-client.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run focused participant authority tests
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/command-authority-server.test.ts \
            test/room-song-command-server.test.ts \
            test/song-authority-server.test.ts \
            test/take-client.test.ts \
            test/take-server.test.ts

      - name: Run real HTTP/3 loopback
        run: npm run test:webtransport-loopback

      - name: Run full suite
        run: npm test

      - name: Commit tested product diff and remove gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/participant-auth-message-once.yml scripts/one-shot-participant-auth-message.py
          git add -- \
            public/app.js \
            public/listen.js \
            public/live-status.js \
            public/participant-auth.js \
            public/presence.js \
            public/recorder.js \
            public/system-details.js \
            public/youtube-sync.js \
            src/server.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/take-client.test.ts
          git diff --cached --check
          git commit -m 'fix: keep participant capability out of websocket URLs'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
