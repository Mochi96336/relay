name: Agent patch publisher ACK authority test

on:
  push:
    branches:
      - agent/publisher-ack-age-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - name: Apply exact test patch
        run: node scripts/agent-patch-publisher-ack-authority-test.mjs
      - name: Commit test patch
        run: |
          if git diff --quiet -- test/ui-authority-freshness.test.ts; then
            echo 'No test patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/ui-authority-freshness.test.ts
          git commit -m 'test(audio): require correlated publisher ACK authority'
          git push origin HEAD:${GITHUB_REF_NAME}
