name: agent-observation-status-v1

on:
  push:
    branches: [agent/observation-status-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/observation-status-v1
      - name: Apply observation status integration
        shell: python
        run: |
          from pathlib import Path

          server = Path('src/server.ts')
          text = server.read_text()
          old = "import { decodePcmFrame } from './pcm-frame.js';"
          new = old + "\nimport { buildRelayObservationStatusV1 } from './observation-status.js';"
          if new not in text:
              if old not in text:
                  raise SystemExit('server import anchor missing')
              text = text.replace(old, new, 1)

          old_route = "app.get('/statusz', (_req, res) => {\n  res.json(remoteStatusPayload());\n});"
          new_route = old_route + "\napp.get('/api/status/v1', (_req, res) => {\n  res.json(observationStatusV1Payload());\n});"
          if new_route not in text:
              if old_route not in text:
                  raise SystemExit('status route anchor missing')
              text = text.replace(old_route, new_route, 1)

          if 'function observationStatusV1Payload()' not in text:
              start = text.index('function remoteStatusPayload() {')
              brace = text.index('{', start)
              depth = 0
              end = None
              for index in range(brace, len(text)):
                  char = text[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit('remoteStatusPayload closing brace not found')
              block = """

function observationStatusV1Payload() {
  const remote = remoteStatusPayload();
  const snapshot = participants.snapshot();

  return buildRelayObservationStatusV1({
    workload: {
      id: 'relay',
      state: remote.state,
      ok: remote.ok,
      uptimeMs: remote.uptimeMs,
    },
    activity: {
      sessionActive: remote.mix.active,
      participants: {
        total: remote.source.participants,
        connected: remote.source.participantsConnected,
      },
      microphoneLease: {
        held: snapshot.micOwnerId !== null,
        transportConnected: remote.source.micConnected,
      },
    },
    sources: {
      backing: {
        connected: remote.source.backingConnected,
        streaming: remote.source.backingStreaming,
        sampleRate: remote.source.backingSampleRate,
        robot: remote.source.backingIsRobot,
        frameAgeMs: remote.source.backingFrameAgeMs,
      },
      microphone: {
        connected: remote.source.micConnected,
        streaming: remote.source.micStreaming,
        sampleRate: remote.source.micSampleRate,
        frameAgeMs: remote.source.micFrameAgeMs,
      },
      robot: {
        routeActive: remote.robot.route,
        sourceConnected: remote.robot.sourceConnected,
        playerDeltaFresh: remote.robot.deltaFresh,
      },
    },
    calibration: {
      kind: remote.robot.calibrationKind,
      stale: remote.robot.calibrationStale,
      timingMode: remote.robot.timingMode,
      activeCalibratedMicLagMs: remote.robot.activeCalibratedMicLagMs,
    },
    mix: remote.mix,
    issues: {
      faults: remote.faults,
      warnings: remote.warnings,
    },
  });
}
"""
              text = text[:end] + block + text[end:]

          server.write_text(text)

          test = Path('test/server.test.ts')
          text = test.read_text()
          helper = "  const status = async () => (await fetch(server.httpUrl('/statusz'))).json();"
          helper_new = helper + "\n  const observationStatus = async () => (await fetch(server.httpUrl('/api/status/v1'))).json();"
          if helper_new not in text:
              if helper not in text:
                  raise SystemExit('remote status test anchor missing')
              text = text.replace(helper, helper_new, 1)

          anchor = "  test('calls a server with nothing connected idle rather than broken', async () => {"
          if "serves a versioned identity-free observation contract" not in text:
              tests = """  test('serves a versioned observation contract while idle', async () => {
    const body = await observationStatus();
    assert.equal(body.schema, 'relay.observation.v1');
    assert.ok(Number.isFinite(Date.parse(body.generatedAt)));
    assert.deepEqual(body.workload.id, 'relay');
    assert.equal(body.workload.state, 'idle');
    assert.equal(body.workload.ok, true);
    assert.equal(body.activity.sessionActive, false);
    assert.deepEqual(body.activity.participants, { total: 0, connected: 0 });
    assert.deepEqual(body.activity.microphoneLease, { held: false, transportConnected: false });
    assert.deepEqual(body.issues, { faults: [], warnings: [] });
  });

  test('serves a versioned identity-free observation contract with an active participant', async () => {
    const participantId = 'participant01';
    const nickname = 'Visible Name';
    const publisher = await RelayClient.connect(
      server,
      `?participant=${participantId}&name=${encodeURIComponent(nickname)}`,
    );
    publisher.send({ type: 'register', role: 'publisher', sampleRate: RATE });
    await publisher.waitForType('registered');

    const body = await observationStatus();
    assert.equal(body.activity.participants.total, 1);
    assert.equal(body.activity.participants.connected, 1);
    assert.equal(body.activity.microphoneLease.held, true);
    assert.equal(body.activity.microphoneLease.transportConnected, true);
    assert.equal(body.sources.microphone.connected, true);

    const serialized = JSON.stringify(body);
    assert.doesNotMatch(serialized, new RegExp(participantId));
    assert.doesNotMatch(serialized, new RegExp(nickname));
    assert.doesNotMatch(serialized, /micOwnerId|nickname|participantId/);

    publisher.close();
    await sleep(100);
  });

"""
              if anchor not in text:
                  raise SystemExit('test insertion anchor missing')
              text = text.replace(anchor, tests + anchor, 1)
          test.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          heading = '### Status another machine can poll\n'
          addition = """### Status another machine can poll

For stable cross-system observation, use **`GET /api/status/v1`**. Its schema is `relay.observation.v1`; the field meanings and privacy/versioning boundary are documented in [`OBSERVATION_CONTRACT.md`](OBSERVATION_CONTRACT.md). It is a read-only, identity-free projection intended for consumers such as `home-pi`. `/statusz` remains the lower-level Relay route diagnostic and is not the integration contract.

"""
          if addition not in text:
              if heading not in text:
                  raise SystemExit('README status heading missing')
              text = text.replace(heading, addition, 1)
          readme.write_text(text)

          Path('.github/workflows/agent-observation-status-v1.yml').unlink()
      - name: Verify
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts test/server.test.ts README.md .github/workflows/agent-observation-status-v1.yml
          git commit -m "feat: expose observation status v1"
          git push origin HEAD:agent/observation-status-v1
