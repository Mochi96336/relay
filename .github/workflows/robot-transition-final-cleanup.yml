name: Robot transition final cleanup

on:
  pull_request:
    branches:
      - agent/correctness-repair

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/robot-transition-bounds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-transition-bounds
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - name: Remove remaining diff noise and narrowing workaround
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          bounds = Path('src/robot-content-transition-bounds.ts')
          replace_once(
              bounds,
              "// Keep the two concrete runtime states documented, but do not make control-flow\n"
              "// narrowing assume a helper call cannot mutate `phase`. The bounds helpers do\n"
              "// mutate it from verifying -> degraded, and TypeScript otherwise treats a\n"
              "// second degraded check in the caller as impossible.\n"
              "export type RobotContentTransitionPhase = 'verifying' | 'degraded' | (string & {});",
              "export type RobotContentTransitionPhase = 'verifying' | 'degraded';",
          )

          server = Path('src/server.ts')
          replace_once(
              server,
              "    noteRobotContentTransitionWorkerFailure(state.bounds, 'anchor', failedAt);\n"
              "    if (state.bounds.phase === 'degraded') {\n",
              "    if (noteRobotContentTransitionWorkerFailure(state.bounds, 'anchor', failedAt)) {\n",
          )
          replace_once(
              server,
              "    noteRobotContentTransitionWorkerFailure(state.bounds, 'compare', failedAt);\n"
              "    if (state.bounds.phase === 'degraded') {\n",
              "    if (noteRobotContentTransitionWorkerFailure(state.bounds, 'compare', failedAt)) {\n",
          )
          replace_once(
              server,
              "        if (contentTimingStart !== null) {\n"
              "          feedContentBackingEvidence(samples, contentTimingStart, nowMs);\n"
              "        }",
              "        if (contentTimingStart !== null) {\n"
              "feedContentBackingEvidence(samples, contentTimingStart, nowMs);\n"
              "        }",
          )
          replace_once(
              server,
              "        && robotContentTimeline.noteFollowerCorrection(\n"
              "          fromMediaTime,\n"
              "          toMediaTime,\n"
              "          context,\n"
              "          nowMs,\n"
              "        );",
              "        && robotContentTimeline.noteFollowerCorrection(\n"
              "fromMediaTime,\n"
              "toMediaTime,\n"
              "context,\n"
              "nowMs,\n"
              ");",
          )
          replace_once(
              server,
              "          beginRobotContentTransition(\n"
              "            fromMediaTime,\n"
              "            toMediaTime,\n"
              "            preDeltaMs,\n"
              "            referenceDeltaMs,\n"
              "            context,\n"
              "            nowMs,\n"
              "          );",
              "beginRobotContentTransition(\n"
              "  fromMediaTime,\n"
              "  toMediaTime,\n"
              "  preDeltaMs,\n"
              "  referenceDeltaMs,\n"
              "  context,\n"
              "  nowMs,\n"
              ");",
          )
          PY
      - name: Typecheck
        run: npm run check
      - name: Targeted transition tests
        run: node --import tsx --test test/robot-content-transition-bounds.test.ts test/robot-content-transition.test.ts test/robot-content-correction-liveness.test.ts
      - name: Commit cleanup and remove helper workflow
        run: |
          rm .github/workflows/robot-transition-final-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts src/robot-content-transition-bounds.ts .github/workflows/robot-transition-final-cleanup.yml
          git commit -m 'chore: tighten robot transition diff'
          git push origin HEAD:agent/robot-transition-bounds
