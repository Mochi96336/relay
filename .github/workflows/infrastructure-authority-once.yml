name: One-shot infrastructure authority hardening

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/infrastructure-authority-once.yml
      - scripts/one-shot-infrastructure-authority.py

permissions:
  contents: write

concurrency:
  group: relay-infrastructure-authority-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Expose deployment npm path for systemd verifier
        run: sudo ln -sf "$(command -v npm)" /usr/bin/npm

      - name: Apply exact infrastructure authority patch
        run: |
          python3 scripts/one-shot-infrastructure-authority.py
          git add -N test/infrastructure-authority.test.ts

      - name: Verify focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            ROBOT_DEPLOYMENT.md \
            chrome-tab-audio-probe/offscreen.js \
            public/source.js \
            scripts/robot-source.sh \
            src/backing-stdin.ts \
            src/server.ts \
            test/helpers/harness.ts \
            test/infrastructure-authority.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Check changed browser and launcher syntax
        run: |
          node --check public/source.js
          node --check chrome-tab-audio-probe/offscreen.js
          bash -n scripts/robot-source.sh

      - name: Run focused authority contracts
        run: |
          node --import tsx --test --test-concurrency=1 \
            test/infrastructure-authority.test.ts \
            test/participant-capability.test.ts \
            test/participant-server.test.ts \
            test/source-seek-authority.test.ts \
            test/source-control-authority.test.ts \
            test/backing-generation-recreation.test.ts

      - name: Verify systemd units
        run: |
          systemd-analyze --user verify deploy/relay-server.service
          systemd-analyze --user verify deploy/relay-robot-source.service

      - name: Run real HTTP/3 loopback
        run: npm run test:webtransport-loopback

      - name: Run full suite with failure annotation
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/relay-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/relay-full-suite.log').read_text(errors='replace').splitlines()
          markers = [i for i, line in enumerate(lines) if ('not ok' in line.lower() or 'assertionerror' in line.lower() or 'err_assertion' in line.lower())]
          if markers:
              start = max(0, min(markers) - 12)
              end = min(len(lines), max(markers) + 80)
          else:
              start = max(0, len(lines) - 200)
              end = len(lines)
          snippet = '\n'.join(lines[start:end])[-14000:]
          escaped = snippet.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Infrastructure authority full-suite failure::{escaped}')
          PY
            exit "$status"
          fi

      - name: Commit tested product diff and remove gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/infrastructure-authority-once.yml \
            scripts/one-shot-infrastructure-authority.py
          git add -- \
            ROBOT_DEPLOYMENT.md \
            chrome-tab-audio-probe/offscreen.js \
            public/source.js \
            scripts/robot-source.sh \
            src/backing-stdin.ts \
            src/server.ts \
            test/helpers/harness.ts \
            test/infrastructure-authority.test.ts
          git diff --cached --check
          git commit -m 'fix: authenticate Relay infrastructure roles'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
