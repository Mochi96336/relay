name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Run npm test
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            message="$(tail -n 120 test-output.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=npm test failed::$message"
          fi
          exit "$status"
