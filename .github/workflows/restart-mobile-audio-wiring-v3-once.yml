name: One-shot restart and mobile audio recovery v3

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/restart-mobile-audio-wiring-v3-once.yml

permissions:
  contents: write

concurrency:
  group: relay-restart-mobile-audio-v3-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply focused runtime recovery wiring
        run: python3 .github/restart-mobile-audio-wiring-v3.py

      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/server.ts src/audio-uplink-health.ts public/app.js public/listen.js test/restart-mobile-audio-contract.test.ts

      - run: npm ci
      - run: npm run check
      - name: Run full suite before writing branch
        run: npm test

      - name: Commit verified runtime fixes and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/restart-mobile-audio-wiring-v2.py \
            .github/restart-mobile-audio-wiring-v3.py \
            .github/workflows/restart-mobile-audio-wiring-once.yml \
            .github/workflows/restart-mobile-audio-wiring-v2-once.yml \
            .github/workflows/restart-mobile-audio-wiring-v3-once.yml
          git add -A -- \
            src/server.ts \
            src/audio-uplink-health.ts \
            public/app.js \
            public/listen.js \
            test/restart-mobile-audio-contract.test.ts \
            .github
          git commit -m 'fix(audio): recover cleanly across restart and mobile suspend'
          git pull --rebase origin agent/stabilize-room-kernel
          git push origin HEAD:agent/stabilize-room-kernel
