name: Agent audio uplink routing construction

on:
  push:
    branches:
      - agent/server-audio-uplink-routing

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Apply exact routing extraction
        shell: bash
        run: |
          echo '<SECRET>' | base64 -d > /tmp/apply-routing.py
          python3 /tmp/apply-routing.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Focused routing and uplink tests
        run: >-
          node --import tsx --test --test-concurrency=1
          test/relay-command-protocol.test.ts
          test/server-command-protocol-routing.test.ts
          test/audio-uplink-health.test.ts
          test/audio-uplink-health-server.test.ts
          test/audio-uplink-health-webtransport.test.ts
      - name: Verify final diff boundary
        shell: bash
        run: |
          git diff --check
          git diff -- src/relay-command-protocol.ts src/server.ts test/relay-command-protocol.test.ts test/server-command-protocol-routing.test.ts
      - name: Commit validated slice and remove construction workflow
        shell: bash
        run: |
          rm .github/workflows/agent-audio-uplink-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/relay-command-protocol.ts src/server.ts test/relay-command-protocol.test.ts test/server-command-protocol-routing.test.ts .github/workflows/agent-audio-uplink-routing.yml
          git commit -m 'refactor(server): route audio uplink health through protocol'
          git push origin HEAD:agent/server-audio-uplink-routing
