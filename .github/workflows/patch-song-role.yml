name: Patch song role transport wiring

on:
  push:
    branches:
      - agent/live-ui-shell
    paths:
      - .github/workflows/patch-song-role.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/live-ui-shell
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - name: Wire exact playback identity into the Live song surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'relay-ui-integration[bot]'
          git config user.email 'relay-ui-integration[bot]@users.noreply.github.com'

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceOnce(path, before, after) {
            let source = readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one patch target, found ${count}`);
            source = source.replace(before, after);
            writeFileSync(path, source);
          }

          replaceOnce(
            'public/youtube-sync.js',
            `let latestRoomCommandId = null;\nlet latestRoomSongStatus = null;`,
            `let latestRoomCommandId = null;\nlet latestRoomSongStatus = null;\nlet latestTimelineStatus = null;`,
          );

          replaceOnce(
            'public/youtube-sync.js',
            `function dispatchHandoff(type, message) {\n  window.dispatchEvent(new CustomEvent(type, { detail: message }));\n}\n\nfunction handleMessage(event) {`,
            `function dispatchHandoff(type, message) {\n  window.dispatchEvent(new CustomEvent(type, { detail: message }));\n}\n\nfunction exactSelfPlayback(status, participantKey, transportKey, generationKey) {\n  const participantId = typeof window.relayParticipantId === 'string'\n    ? window.relayParticipantId.trim()\n    : '';\n  if (!participantId || !status || typeof status !== 'object') return false;\n  return status[participantKey] === participantId\n    && status[transportKey] === transportId\n    && Number(status[generationKey]) === playbackGeneration;\n}\n\nfunction currentPlaybackRole() {\n  const timeline = latestTimelineStatus;\n  if (!timeline) return null;\n\n  const hasSong = typeof latestRoomSongStatus?.videoId === 'string'\n    || typeof timeline.videoId === 'string';\n  if (!hasSong) return 'empty';\n\n  if (\n    timeline.handoffState !== 'idle'\n    && exactSelfPlayback(\n      timeline,\n      'handoffTargetParticipantId',\n      'handoffTargetPlaybackTransportId',\n      'handoffTargetPlaybackGeneration',\n    )\n  ) return 'preparing';\n\n  if (exactSelfPlayback(\n    timeline,\n    'playbackLeaderParticipantId',\n    'playbackTransportId',\n    'playbackGeneration',\n  )) return 'holder';\n\n  return 'observer';\n}\n\nfunction dispatchPlaybackView() {\n  const role = currentPlaybackRole();\n  if (!role) return;\n  window.dispatchEvent(new CustomEvent('relay:playback-view', {\n    detail: {\n      role,\n      room: latestRoomSongStatus,\n      timeline: latestTimelineStatus,\n      transportId,\n      playbackGeneration,\n    },\n  }));\n}\n\nfunction handleMessage(event) {`,
          );

          replaceOnce(
            'public/youtube-sync.js',
            `  if (message.type === 'youtube-timeline-status') {\n    renderTimeline(message);\n    return;\n  }\n\n  if (message.type === 'room-song-status') {\n    latestRoomSongStatus = message;\n    return;\n  }`,
            `  if (message.type === 'youtube-timeline-status') {\n    latestTimelineStatus = message;\n    renderTimeline(message);\n    dispatchPlaybackView();\n    return;\n  }\n\n  if (message.type === 'room-song-status') {\n    latestRoomSongStatus = message;\n    dispatchPlaybackView();\n    return;\n  }`,
          );

          replaceOnce(
            'public/youtube-sync.js',
            `    if (message.room && typeof message.room === 'object') latestRoomSongStatus = message.room;\n    dispatchRoomCommand('relay:room-song-command-rejected', withLatestRoom(message));`,
            `    if (message.room && typeof message.room === 'object') {\n      latestRoomSongStatus = message.room;\n      dispatchPlaybackView();\n    }\n    dispatchRoomCommand('relay:room-song-command-rejected', withLatestRoom(message));`,
          );

          replaceOnce(
            'public/youtube.js',
            `let localCommandPending = null;\nlet serverMutation = null;`,
            `let localCommandPending = null;\nlet serverMutation = null;\nlet playbackRole = 'connecting';`,
          );

          replaceOnce(
            'public/youtube.js',
            `function requestRoomSongCommand(detail) {\n  // Phase 1B deliberately replaces the page's previous local intent.`,
            `function requestRoomSongCommand(detail) {\n  if (playbackRole === 'observer') {\n    noteNode.textContent = 'Room playback is on another phone. Take the mic on this phone before changing the song.';\n    return false;\n  }\n\n  // Phase 1B deliberately replaces the page's previous local intent.`,
          );

          replaceOnce(
            'public/youtube.js',
            `  // During preparation the target player is deliberately being cued before it\n  // owns the room clock. Do not turn that local preparation into product input.\n  if (pendingHandoff?.phase === 'preparing') return;`,
            `  // Observer pages render the room-owned song but do not publish a competing\n  // local media clock. The exact handoff target becomes "preparing" before it\n  // needs to interact with the player, so this does not block takeover.\n  if (playbackRole === 'observer') return;\n\n  // During preparation the target player is deliberately being cued before it\n  // owns the room clock. Do not turn that local preparation into product input.\n  if (pendingHandoff?.phase === 'preparing') return;`,
          );

          replaceOnce(
            'public/youtube.js',
            `function trackedRoomCommandId() {\n  return localCommandPending?.commandId\n    ?? (serverMutation?.source === 'room-command' ? serverMutation.commandId : null);\n}\n\nwindow.addEventListener('relay:room-song-command-sent', (event) => {`,
            `function trackedRoomCommandId() {\n  return localCommandPending?.commandId\n    ?? (serverMutation?.source === 'room-command' ? serverMutation.commandId : null);\n}\n\nwindow.addEventListener('relay:playback-view', (event) => {\n  const nextRole = event.detail?.role;\n  if (!['empty', 'holder', 'preparing', 'observer'].includes(nextRole)) return;\n  if (nextRole === playbackRole) return;\n\n  playbackRole = nextRole;\n  if (nextRole === 'observer') {\n    localCommandPending = null;\n    if (serverMutation?.source === 'room-command') serverMutation = null;\n    if (playerReady && player) {\n      serverMutation = {\n        source: 'observer-quiet',\n        action: 'pause',\n        suppressTelemetry: true,\n        expiresAt: performance.now() + 1_200,\n      };\n      try { player.pauseVideo(); } catch {}\n    }\n    return;\n  }\n\n  if (serverMutation?.source === 'observer-quiet') serverMutation = null;\n});\n\nwindow.addEventListener('relay:room-song-command-sent', (event) => {`,
          );
          NODE

          rm .github/workflows/patch-song-role.yml
          git add -A

          npm ci
          npm run check
          for f in public/*.js; do node --check "$f"; done
          bash -n scripts/*.sh
          npm test

          git commit -m 'feat(ui): bind song surface to playback transport authority'
          git push origin HEAD:agent/live-ui-shell
