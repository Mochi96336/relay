name: Agent patch live health ACK fixture

on:
  push:
    branches:
      - agent/publisher-ack-age-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
      - name: Apply exact fixture patch
        run: node scripts/agent-patch-live-health-ack-fixture.mjs
      - name: Commit fixture patch
        run: |
          if git diff --quiet -- test/browser/live-interaction.spec.mjs; then
            echo 'No fixture patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/browser/live-interaction.spec.mjs
          git commit -m 'test(audio): echo publisher health request id in live fixture'
          git push origin HEAD:${GITHUB_REF_NAME}
