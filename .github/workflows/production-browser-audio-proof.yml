name: Production browser audio proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-browser-audio-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: Start CI audio backend
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: Install Chromium
        run: npx -y playwright@1.56.0 install chromium
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.0
      - name: Prove production browser audio path
        id: production-browser-audio
        run: bash scripts/ci-run.sh production-browser-audio-proof production-browser-audio "production browser audio path" -- npx playwright test test/browser/production-audio-proof.spec.mjs --workers=1 --reporter=line
      - name: Upload production browser audio failure summary
        if: failure() && steps.production-browser-audio.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-production-browser-audio
          path: ci-summary/production-browser-audio-failure.txt
          if-no-files-found: error
          retention-days: 7
