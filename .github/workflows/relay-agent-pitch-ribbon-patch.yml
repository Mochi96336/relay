name: relay-agent-pitch-ribbon-patch

on:
  push:
    branches:
      - agent/live-p0-pitch-ribbon
  pull_request:
    branches:
      - agent/live-product-repair

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.sha || github.sha, '') && !contains(github.event.head_commit.message || github.event.pull_request.title, '[pitch-ribbon-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-p0-pitch-ribbon
          fetch-depth: 0
      - name: Patch large production files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch target, found {count}')
              p.write_text(text.replace(old, new))

          replace_once('public/app.js', """  dispatchRelayEvent('relay-local-mic-level', {
            active: false,
            peakDbfs: null,
            rmsDbfs: null,
            spectrumBands: null,
          });""", """  dispatchRelayEvent('relay-local-mic-level', {
            active: false,
            captureGeneration: captureGeneration >>> 0,
            peakDbfs: null,
            rmsDbfs: null,
            spectrumBands: null,
            f0Hz: null,
            pitchConfidence: 0,
          });""")

          replace_once('public/app.js', """        const spectrumBands = rawSpectrumBands.length === 5 && rawSpectrumBands.every(Number.isFinite)
              ? rawSpectrumBands
              : null;
            if (Number.isFinite(peakDbfs) && Number.isFinite(rmsDbfs)) {
              latestLocalMicLevel = { peakDbfs, rmsDbfs, spectrumBands };
              dispatchRelayEvent('relay-local-mic-level', {
                active: true,
                peakDbfs,
                rmsDbfs,
                spectrumBands,
              });""", """        const spectrumBands = rawSpectrumBands.length === 5 && rawSpectrumBands.every(Number.isFinite)
              ? rawSpectrumBands
              : null;
            const rawF0Hz = event.data.f0Hz;
            const f0Hz = rawF0Hz === null ? null : Number(rawF0Hz);
            const pitchConfidence = Number(event.data.pitchConfidence);
            const pitchValid = (f0Hz === null || Number.isFinite(f0Hz))
              && Number.isFinite(pitchConfidence)
              && pitchConfidence >= 0
              && pitchConfidence <= 1;
            if (Number.isFinite(peakDbfs) && Number.isFinite(rmsDbfs) && pitchValid) {
              latestLocalMicLevel = { peakDbfs, rmsDbfs, spectrumBands, f0Hz, pitchConfidence };
              dispatchRelayEvent('relay-local-mic-level', {
                active: true,
                captureGeneration: captureGeneration >>> 0,
                peakDbfs,
                rmsDbfs,
                spectrumBands,
                f0Hz,
                pitchConfidence,
              });""")

          replace_once('public/live-status.js', """    const rmsDbfs = Number(message.rmsDbfs);
            const spectrumBands = Array.isArray(message.spectrumBands)""", """    const rmsDbfs = Number(message.rmsDbfs);
            const rawF0Hz = message.f0Hz;
            const f0Hz = rawF0Hz === null ? null : Number(rawF0Hz);
            const pitchConfidence = Number(message.pitchConfidence);
            const spectrumBands = Array.isArray(message.spectrumBands)""")

          replace_once('public/live-status.js', """      || !Number.isFinite(rmsDbfs)
              || spectrumBands.length !== 5""", """      || !Number.isFinite(rmsDbfs)
              || (f0Hz !== null && (!Number.isFinite(f0Hz) || f0Hz < 80 || f0Hz > 1000))
              || !Number.isFinite(pitchConfidence)
              || pitchConfidence < 0
              || pitchConfidence > 1
              || spectrumBands.length !== 5""")

          replace_once('public/live-status.js', """      rmsDbfs,
              spectrumBands,
            });""", """      rmsDbfs,
              spectrumBands,
              f0Hz,
              pitchConfidence,
            });""")

          replace_once('public/live-status.js', """    const rmsDbfs = Number(event.detail?.rmsDbfs);
            const spectrumBands = Array.isArray(event.detail?.spectrumBands)""", """    const captureGeneration = Number(event.detail?.captureGeneration);
            const rmsDbfs = Number(event.detail?.rmsDbfs);
            const rawF0Hz = event.detail?.f0Hz;
            const f0Hz = rawF0Hz === null ? null : Number(rawF0Hz);
            const pitchConfidence = Number(event.detail?.pitchConfidence);
            const spectrumBands = Array.isArray(event.detail?.spectrumBands)""")

          replace_once('public/live-status.js', """      !Number.isFinite(rmsDbfs)
              || spectrumBands.length !== 5""", """      !Number.isInteger(captureGeneration)
              || captureGeneration < 0
              || captureGeneration > 0xffff_ffff
              || !Number.isFinite(rmsDbfs)
              || (f0Hz !== null && (!Number.isFinite(f0Hz) || f0Hz < 80 || f0Hz > 1000))
              || !Number.isFinite(pitchConfidence)
              || pitchConfidence < 0
              || pitchConfidence > 1
              || spectrumBands.length !== 5""")

          replace_once('public/live-status.js', """      version: 1,
              rmsDbfs,
              spectrumBands,
            }));""", """      version: 1,
              captureGeneration: captureGeneration >>> 0,
              rmsDbfs,
              spectrumBands,
              f0Hz,
              pitchConfidence,
            }));""")

          replace_once('src/server.ts', """        || micMediaGeneration === null
                || !micStreaming(nowMs)""", """        || micMediaGeneration === null
                || presence.captureGeneration !== micMediaGeneration
                || !micStreaming(nowMs)""")

          replace_once('src/server.ts', """        rmsDbfs: presence.rmsDbfs,
              spectrumBands: presence.spectrumBands,
            });""", """        rmsDbfs: presence.rmsDbfs,
              spectrumBands: presence.spectrumBands,
              f0Hz: presence.f0Hz,
              pitchConfidence: presence.pitchConfidence,
            });""")
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Commit production patches
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/live-status.js src/server.ts
          git commit -m 'refactor(ui): wire truthful Room Mic pitch telemetry [pitch-ribbon-patched]'
          git push origin HEAD:agent/live-p0-pitch-ribbon
