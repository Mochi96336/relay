name: Agent boot probe promotion exact patch

on:
  push:
    branches:
      - agent/boot-probe-calibration-promotion-coordinator

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact server patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text()

          import_anchor = "import { createRelayBackingGraceExpiryCoordinator } from './relay-backing-grace-expiry-coordinator.js';\n"
          import_line = "import { createRelayBootProbeCalibrationPromotionCoordinator } from './relay-boot-probe-calibration-promotion-coordinator.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count was {text.count(import_anchor)}, expected 1')
          if import_line in text:
              raise SystemExit('promotion coordinator import already present')
          text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = "\n".join([
              'function promoteBootProbeCalibration(',
              '  mutateProbe: () => void,',
              '  result: () => { micLagMs: number; confidence: number },',
              ') {',
              '  mutateProbe();',
              '  timingRuntime.markBootProbeAuthority();',
              '  calibration.applyExternalResult(result());',
              '}',
          ])
          new = "\n".join([
              'const bootProbeCalibrationPromotionCoordinator =',
              '  createRelayBootProbeCalibrationPromotionCoordinator({',
              '    markBootProbeAuthority: () => timingRuntime.markBootProbeAuthority(),',
              '    applyExternalResult: (result) => calibration.applyExternalResult(result),',
              '  });',
              '',
              'function promoteBootProbeCalibration(',
              '  mutateProbe: () => void,',
              '  result: () => { micLagMs: number; confidence: number },',
              ') {',
              '  bootProbeCalibrationPromotionCoordinator.promote(mutateProbe, result);',
              '}',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'old promotion function count was {text.count(old)}, expected 1')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/server.ts"
          read additions deletions _ < <(git diff --numstat -- src/server.ts)
          test "$additions" -le 15
          test "$deletions" -le 5

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          git commit -m 'refactor(probe): delegate calibration promotion ordering'
          git push origin HEAD:agent/boot-probe-calibration-promotion-coordinator
