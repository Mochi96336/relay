name: Release integration probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/release-executor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Build feeder integration tree
        shell: bash
        run: |
          sed "/echo '=== verify integrated feeder tree ==='/,$d" .github/release-integrate.sh > /tmp/release-build.sh
          bash /tmp/release-build.sh
          echo FEEDER_TREE_BUILT
      - name: Verify reconciled product tree
        shell: bash
        run: |
          git show origin/agent/release-executor:.github/release-prepostfix.sh > /tmp/release-prepostfix.sh
          git show origin/agent/release-executor:.github/release-postfix.sh > /tmp/release-postfix.sh
          bash /tmp/release-prepostfix.sh
          bash /tmp/release-postfix.sh
      - name: Integrate current main, verify HTTP3, and publish RC
        shell: bash
        run: |
          git show origin/agent/release-executor:.github/release-finalize.sh > /tmp/release-finalize.sh
          bash /tmp/release-finalize.sh
