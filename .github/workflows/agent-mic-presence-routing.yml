name: Agent mic presence routing construction

on:
  push:
    branches:
      - agent/server-mic-presence-routing

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Move only Mic presence routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/server.ts')
          text = path.read_text()
          header = "    if (payload.type === 'mic-presence-telemetry') {\n"
          next_marker = "\n\n\n    if (payload.type === 'start-timing-calibration') {"
          start = text.index(header)
          end = text.index(next_marker, start)
          block = text[start:end]
          inner = block[len(header):]
          if not inner.endswith('    }'):
              raise SystemExit('Mic presence block ending changed')
          inner = inner[:-5]
          dedented = ''.join(
              line[2:] if line.startswith('  ') else line
              for line in inner.splitlines(keepends=True)
          )
          handler = (
              "  micPresenceTelemetry: (socket, payload) => {\n"
              + dedented
              + "  },"
          )

          text = text[:start] + text[end:]
          anchor = text.index('  audioUplinkHealth: (socket, payload) => {')
          close = text.index('\n\n});', anchor)
          text = text[:close] + '\n' + handler + text[close:]

          if "payload.type === 'mic-presence-telemetry'" in text:
              raise SystemExit('inline Mic presence selector still exists')
          for marker in (
              'micPresenceTelemetry: (socket, payload) => {',
              'const presence = parseMicPresenceTelemetry(payload);',
              'socket.participantId !== participants.micOwnerId',
              'socket.participantId !== micRuntime.mediaOwnerId',
              'presence.captureGeneration !== micRuntime.mediaGeneration',
              'nowMs - socket.micPresenceTelemetryAt! < 60',
              "type: 'room-mic-presence'",
          ):
              if marker not in text:
                  raise SystemExit(f'missing retained Mic presence marker: {marker}')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Focused routing and Mic presence tests
        run: >-
          node --import tsx --test --test-concurrency=1
          test/relay-command-protocol.test.ts
          test/server-command-protocol-routing.test.ts
          test/mic-presence-telemetry.test.ts
          test/room-mic-presence-contract.test.ts
          test/room-mic-presence-server.test.ts
      - name: Verify diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/server.ts src/relay-command-protocol.ts test/relay-command-protocol.test.ts test/server-command-protocol-routing.test.ts test/room-mic-presence-contract.test.ts
      - name: Commit validated server move
        shell: bash
        run: |
          rm .github/workflows/agent-mic-presence-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/agent-mic-presence-routing.yml
          git commit -m 'refactor(server): route Mic presence through protocol'
          git push origin HEAD:agent/server-mic-presence-routing
