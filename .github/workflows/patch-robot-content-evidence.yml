name: Apply Robot content evidence readiness patch

on:
  push:
    branches:
      - agent/robot-content-evidence-readiness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/robot-content-evidence-readiness
      - name: Patch server and remove one-shot tooling
        run: |
          python scripts/patch-robot-content-evidence.py
          rm scripts/patch-robot-content-evidence.py
          rm .github/workflows/patch-robot-content-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(timing): gate content calibration on usable Robot mapping"
          git push origin HEAD:agent/robot-content-evidence-readiness
