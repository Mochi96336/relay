name: One-shot publisher acquire authority wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/authority-acquire-once.yml

permissions:
  contents: write

concurrency:
  group: relay-authority-acquire-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact acquire/takeover wiring
        run: python3 .github/authority-acquire-once.py

      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/server.ts

      - run: npm ci
      - run: npm run check
      - name: Run full suite
        run: npm test

      - name: Commit tested product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/server.ts
          git commit -m 'refactor: wire publisher mic ownership effects'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
