name: Construct boot-probe promotion ordering

on:
  push:
    branches:
      - agent/boot-probe-promotion-ordering

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded server patch
        run: node scripts/construct-boot-probe-promotion.mjs
      - name: Typecheck
        run: npm run check
      - name: Prove promotion ordering contract
        run: node --import tsx --test test/server-boot-probe-calibration-promotion.test.ts
      - name: Preserve Robot calibration semantics
        run: node --import tsx --test test/robot-calibration-semantics.test.ts
      - name: Verify diff and commit clean output
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(server): centralize boot-probe calibration promotion"
          git push
