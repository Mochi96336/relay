name: CI

on:
  pull_request:
  push:
    branches: [agent/observation-status-v1]

permissions:
  contents: write

jobs:
  apply-observation-contract:
    if: github.event_name == 'push' && github.ref_name == 'agent/observation-status-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/observation-status-v1
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - name: Apply integration
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('src/server.ts')
          text = server.read_text()
          import_anchor = "import { decodePcmFrame } from './pcm-frame.js';"
          import_line = "import { buildRelayObservationStatusV1 } from './observation-status.js';"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          route_anchor = "app.get('/statusz', (_req, res) => {\n  res.json(remoteStatusPayload());\n});"
          route = "app.get('/api/status/v1', (_req, res) => {\n  res.json(observationStatusV1Payload());\n});"
          if route not in text:
              text = text.replace(route_anchor, route_anchor + '\n' + route, 1)

          if 'function observationStatusV1Payload()' not in text:
              marker = 'function recommendedMicGainDb('
              block = '''function observationStatusV1Payload() {
  const remote = remoteStatusPayload();
  const snapshot = participants.snapshot();

  return buildRelayObservationStatusV1({
    workload: {
      id: 'relay',
      state: remote.state,
      ok: remote.ok,
      uptimeMs: remote.uptimeMs,
    },
    activity: {
      sessionActive: remote.mix.active,
      participants: {
        total: remote.source.participants,
        connected: remote.source.participantsConnected,
      },
      microphoneLease: {
        held: snapshot.micOwnerId !== null,
        transportConnected: remote.source.micConnected,
      },
    },
    sources: {
      backing: {
        connected: remote.source.backingConnected,
        streaming: remote.source.backingStreaming,
        sampleRate: remote.source.backingSampleRate,
        robot: remote.source.backingIsRobot,
        frameAgeMs: remote.source.backingFrameAgeMs,
      },
      microphone: {
        connected: remote.source.micConnected,
        streaming: remote.source.micStreaming,
        sampleRate: publisherSampleRate,
        frameAgeMs: remote.source.micFrameAgeMs,
      },
      robot: {
        routeActive: remote.robot.route,
        sourceConnected: remote.robot.sourceConnected,
        playerDeltaFresh: remote.robot.deltaFresh,
      },
    },
    calibration: {
      kind: remote.robot.calibrationKind,
      stale: remote.robot.calibrationStale,
      timingMode: remote.robot.timingMode,
      activeCalibratedMicLagMs: remote.robot.activeCalibratedMicLagMs,
    },
    mix: remote.mix,
    issues: {
      faults: remote.faults,
      warnings: remote.warnings,
    },
  });
}

'''
              if marker not in text:
                  raise SystemExit('server insertion marker missing')
              text = text.replace(marker, block + marker, 1)
          server.write_text(text)

          test = Path('test/observation-status.test.ts')
          test.write_text('''import assert from 'node:assert/strict';
import test, { after, before, describe } from 'node:test';

import { RelayClient, sleep, startRelay, type RelayServer } from './helpers/harness.js';

const RATE = 48_000;
const FAST = {
  RELAY_HEARTBEAT_MS: '60000',
  RELAY_AUTO_CALIBRATE: '0',
};

describe('observation status v1', () => {
  let server: RelayServer;
  before(async () => { server = await startRelay(FAST); });
  after(async () => { await server.stop(); });

  const status = async () => (await fetch(server.httpUrl('/api/status/v1'))).json();

  test('treats an idle Relay as normal rather than broken', async () => {
    const body = await status();
    assert.equal(body.schema, 'relay.observation.v1');
    assert.ok(Number.isFinite(Date.parse(body.generatedAt)));
    assert.equal(body.workload.id, 'relay');
    assert.equal(body.workload.state, 'idle');
    assert.equal(body.workload.ok, true);
    assert.equal(body.activity.sessionActive, false);
    assert.deepEqual(body.activity.participants, { total: 0, connected: 0 });
    assert.deepEqual(body.activity.microphoneLease, { held: false, transportConnected: false });
    assert.deepEqual(body.issues, { faults: [], warnings: [] });
  });

  test('publishes anonymous aggregate presence and lease state only', async () => {
    const participantId = 'participant01';
    const nickname = 'Visible Name';
    const publisher = await RelayClient.connect(
      server,
      `?participant=${participantId}&name=${encodeURIComponent(nickname)}`,
    );
    publisher.send({ type: 'register', role: 'publisher', sampleRate: RATE });
    await publisher.waitForType('registered');

    const body = await status();
    assert.equal(body.activity.participants.total, 1);
    assert.equal(body.activity.participants.connected, 1);
    assert.equal(body.activity.microphoneLease.held, true);
    assert.equal(body.activity.microphoneLease.transportConnected, true);
    assert.equal(body.sources.microphone.connected, true);
    assert.equal(body.sources.microphone.sampleRate, RATE);

    const serialized = JSON.stringify(body);
    assert.doesNotMatch(serialized, new RegExp(participantId));
    assert.doesNotMatch(serialized, new RegExp(nickname));
    assert.doesNotMatch(serialized, /micOwnerId|nickname|participantId/);

    publisher.close();
    await sleep(100);
  });
});
''')

          readme = Path('README.md')
          text = readme.read_text()
          heading = '### Status another machine can poll\n'
          paragraph = "For stable cross-system observation, use **`GET /api/status/v1`**. Its schema is `relay.observation.v1`; the field meanings and privacy/versioning boundary are documented in [`OBSERVATION_CONTRACT.md`](OBSERVATION_CONTRACT.md). It is a read-only, identity-free projection intended for consumers such as `home-pi`. `/statusz` remains the lower-level Relay route diagnostic and is not the integration contract.\n\n"
          if paragraph not in text:
              if heading not in text:
                  raise SystemExit('README status heading missing')
              text = text.replace(heading, heading + '\n' + paragraph, 1)
          readme.write_text(text)

          for path in [
              Path('.github/workflows/agent-observation-status-v1.yml'),
              Path('.github/workflows/agent-observation-status-v1-fix.yml'),
          ]:
              if path.exists():
                  path.unlink()

          Path('.github/workflows/ci.yml').write_text('''name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Run npm test
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            message="$(tail -n 120 test-output.log | sed -e 's/%/%25/g' -e 's/\\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=npm test failed::$message"
          fi
          exit "$status"
''')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: expose observation status v1"
          git push origin HEAD:agent/observation-status-v1

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check browser JavaScript syntax
        run: find public chrome-tab-audio-probe -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check launcher shell syntax
        run: bash -n scripts/*.sh
      - name: Run npm test
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            message="$(tail -n 120 test-output.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=npm test failed::$message"
          fi
          exit "$status"
