name: One-shot live mix headroom fix

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/live-mix-headroom-once.yml
      - scripts/one-shot-live-mix-headroom.py

permissions:
  contents: write

concurrency:
  group: relay-live-mix-headroom-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact live-mix headroom patch
        run: python3 scripts/one-shot-live-mix-headroom.py

      - name: Verify focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/audio-session.ts \
            test/audio-session.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check

      - name: Run focused audio-session tests
        run: node --import tsx --test --test-concurrency=1 test/audio-session.test.ts

      - name: Run full suite
        run: npm test

      - name: Commit tested product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Mochi96336@users.noreply.github.com'
          git add -- src/audio-session.ts test/audio-session.test.ts
          git diff --cached --check
          git commit -m 'fix: reserve headroom before summing live mix'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
