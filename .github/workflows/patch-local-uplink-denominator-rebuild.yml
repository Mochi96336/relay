name: "Patch local uplink denominator rebuild"

on:
  push:
    branches:
      - agent/mic-local-uplink-underdelivery-rebuild

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/mic-local-uplink-underdelivery-rebuild
          fetch-depth: 0
      - name: Patch denominator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/audio-transport.js')
          text = path.read_text()
          old = """      const submittedPacketTotal = this.telemetry.webSocketPacketsSent
        + this.telemetry.webTransportPacketsSubmitted;"""
          new = """      // Coverage starts at the browser transport decision boundary. A media
      // packet rejected by the bounded realtime queue is a final timeline hole,
      // not an in-flight packet: app.js never replays congestion rejects.
      // Control-message congestion has separate counters and is not included.
      const submittedPacketTotal = this.telemetry.webSocketPacketsSent
        + this.telemetry.webTransportPacketsSubmitted
        + this.telemetry.webSocketCongestedRejects
        + this.telemetry.webTransportCongestedRejects;"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one denominator hunk, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | grep -v '^public/audio-transport.js$' | wc -l)" -eq 0
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-local-uplink-denominator-rebuild.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/audio-transport.js .github/workflows/patch-local-uplink-denominator-rebuild.yml
          git commit -m "fix(audio): count final local media congestion in coverage"
          git push origin HEAD:agent/mic-local-uplink-underdelivery-rebuild
