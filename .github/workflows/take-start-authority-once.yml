name: One-shot Take start authority wiring

on:
  push:
    branches:
      - agent/stabilize-room-kernel
    paths:
      - .github/workflows/take-start-authority-once.yml

permissions:
  contents: write

concurrency:
  group: relay-take-start-authority-once
  cancel-in-progress: false

jobs:
  patch-test-rebase-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-room-kernel
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm

      - name: Apply exact Take start authority patch
        run: |
          python3 .github/take-start-authority-once.py
          python3 .github/take-start-fixtures-once.py

      - name: Verify focused diff
        run: |
          git add -N -- src/take-start-policy.ts test/take-start-policy.test.ts
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/product-view-model.ts \
            src/server.ts \
            src/take-start-policy.ts \
            test/product-actions.test.ts \
            test/take-owner-release-evidence-server.test.ts \
            test/take-server.test.ts \
            test/take-start-policy.test.ts | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected diff:\n%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - run: npm ci
      - run: npm run check
      - name: Run focused Take authority tests
        run: node --import tsx --test --test-concurrency=1 test/take-start-policy.test.ts test/product-actions.test.ts test/take-server.test.ts test/take-owner-release-evidence-server.test.ts test/voice-only-room.test.ts
      - name: Run full suite
        run: npm test

      - name: Commit tested product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/product-view-model.ts \
            src/server.ts \
            src/take-start-policy.ts \
            test/product-actions.test.ts \
            test/take-owner-release-evidence-server.test.ts \
            test/take-server.test.ts \
            test/take-start-policy.test.ts
          git commit -m 'refactor: centralize Take start authority'

      - name: Rebase tested product commit onto latest branch and push
        env:
          BRANCH: agent/stabilize-room-kernel
        run: |
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
